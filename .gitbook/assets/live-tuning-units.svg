<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The number you type is not the number you read</title>
<desc id="d">Two examples. For a flywheel you type 3000 RPM into closedloop/setpoint/velocity and mechanism/velocity reads 50 rotations per second. For an arm you type 30 degrees into mechanism/limit/upper and mechanism/position reads 0.0833 rotations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
<rect width="760" height="322" fill="#f5f7fa"/>
<rect x="16" y="16" width="728" height="290" rx="10" fill="#ffffff" stroke="#cbd2d9"/>
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >The number you type is not the number you read</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Tunable and read-only fields sit side by side on the dashboard, in different units.</text>
<rect x="34" y="84" width="340" height="184" rx="8" fill="#fafbfc" stroke="#cbd2d9"/>
<text x="50.0" y="108.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" >Flywheel speed</text>
<text x="50.0" y="134.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" >You type</text>
<rect x="50" y="142" width="308" height="40" rx="6" fill="#fde3c8" stroke="#c2630b" stroke-width="1.5"/>
<text x="64.0" y="169.0" font-size="20" font-weight="700" text-anchor="start" fill="#1f2933" >3000</text>
<text x="122.0" y="169.0" font-size="13" font-weight="700" text-anchor="start" fill="#c2630b" >RPM</text>
<text x="346.0" y="167.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#52606d" font-family="Consolas, Menlo, monospace">closedloop/setpoint/velocity</text>
<text x="204.0" y="200.0" font-size="12" font-weight="700" text-anchor="middle" fill="#52606d" >÷ 60</text>
<text x="50.0" y="208.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" >You read</text>
<rect x="50" y="216" width="308" height="40" rx="6" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.5"/>
<text x="64.0" y="243.0" font-size="20" font-weight="700" text-anchor="start" fill="#1f2933" >50</text>
<text x="97.0" y="243.0" font-size="13" font-weight="700" text-anchor="start" fill="#3e6da8" >rot/s</text>
<text x="346.0" y="241.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#52606d" font-family="Consolas, Menlo, monospace">mechanism/velocity</text>
<rect x="386" y="84" width="340" height="184" rx="8" fill="#fafbfc" stroke="#cbd2d9"/>
<text x="402.0" y="108.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" >Arm soft limit</text>
<text x="402.0" y="134.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" >You type</text>
<rect x="402" y="142" width="308" height="40" rx="6" fill="#fde3c8" stroke="#c2630b" stroke-width="1.5"/>
<text x="416.0" y="169.0" font-size="20" font-weight="700" text-anchor="start" fill="#1f2933" >30</text>
<text x="449.0" y="169.0" font-size="13" font-weight="700" text-anchor="start" fill="#c2630b" >degrees</text>
<text x="698.0" y="167.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#52606d" font-family="Consolas, Menlo, monospace">mechanism/limit/upper</text>
<text x="556.0" y="200.0" font-size="12" font-weight="700" text-anchor="middle" fill="#52606d" >÷ 360</text>
<text x="402.0" y="208.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" >You read</text>
<rect x="402" y="216" width="308" height="40" rx="6" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.5"/>
<text x="416.0" y="243.0" font-size="20" font-weight="700" text-anchor="start" fill="#1f2933" >0.0833</text>
<text x="499.0" y="243.0" font-size="13" font-weight="700" text-anchor="start" fill="#3e6da8" >rotations</text>
<text x="698.0" y="241.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#52606d" font-family="Consolas, Menlo, monospace">mechanism/position</text>
<text x="34.0" y="294.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2933" >Tunable fields use degrees and RPM. Read-only fields use rotations and rotations per second.</text>
</svg>
