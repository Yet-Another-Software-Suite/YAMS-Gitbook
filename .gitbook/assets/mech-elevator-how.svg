<rect x="440.0" y="132.0" width="60.0" height="34.0" rx="4" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.8" />
<text x="470.0" y="153.0" font-size="9.6" font-weight="700" text-anchor="middle" fill="#3e6da8" >carriage</text>
<line x1="516.0" y1="266.0" x2="516.0" y2="149.0" stroke="#c2630b" stroke-width="2" stroke-linecap="round"/>
<line x1="510.0" y1="266.0" x2="522.0" y2="266.0" stroke="#c2630b" stroke-width="2" stroke-linecap="round"/>
<line x1="510.0" y1="149.0" x2="522.0" y2="149.0" stroke="#c2630b" stroke-width="2" stroke-linecap="round"/>
<text x="524.0" y="212.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" >height</text>
<rect x="576.0" y="104.0" width="150.0" height="150.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<text x="588.0" y="126.0" font-size="11" font-weight="700" text-anchor="start" fill="#1f2933" >One drum rotation</text>
<text x="588.0" y="146.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >lifts the carriage</text>
<text x="588.0" y="162.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >one circumference.</text>
<text x="588.0" y="190.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >height =</text>
<text x="588.0" y="206.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >drum rotations</text>
<text x="588.0" y="222.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >x circumference</text>
<text x="588.0" y="244.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >so you work in meters</text>
<text x="34.0" y="290.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >An elevator is a rotating motor that YAMS lets you treat as a distance.</text>
</svg>
