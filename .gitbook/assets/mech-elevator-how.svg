<circle cx="300.0" cy="190.0" r="4" fill="#1f2933" stroke="none" stroke-width="1.6" />
<text x="300.0" y="244.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#147d6f" >drum or sprocket</text>
<text x="300.0" y="259.0" font-size="9.2" font-weight="400" text-anchor="middle" fill="#52606d" >withDrumRadius</text>
