<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" width="760" height="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">SwerveModuleConfig: withLocation</title>
<desc id="d">A top view of a robot with the center at zero, plus X pointing forward and plus Y pointing left. The front left module is at 0.3, 0.3; front right at 0.3, minus 0.3; back left at minus 0.3, 0.3; back right at minus 0.3, minus 0.3, in meters.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="326" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="294.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >SwerveModuleConfig: withLocation</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Where each module is, measured from the center of the robot.</text>
<rect x="125.0" y="115.0" width="150.0" height="150.0" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="2" />
<circle cx="200.0" cy="190.0" r="5" fill="#d64545" stroke="none" stroke-width="1.6" />
<text x="209.0" y="206.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#d64545" >center (0, 0)</text>
<line x1="200.0" y1="190.0" x2="200.0" y2="86.0" stroke="#c2630b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ao)"/>
<text x="208.0" y="90.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" >+X: forward</text>
<line x1="200.0" y1="190.0" x2="96.0" y2="190.0" stroke="#6b46c1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ap)"/>
<text x="94.0" y="182.0" font-size="10.5" font-weight="700" text-anchor="end" fill="#6b46c1" >+Y: left</text>
<g transform="translate(139.0,137.0) rotate(0.0)"><rect x="-7.0" y="-17.0" width="14.0" height="34.0" rx="4" fill="#1f2933" stroke="#1f2933" stroke-width="0" /><path d="M-4,-9.0 L0,-15.0 L4,-9.0 Z" fill="#ffffff"/></g>
