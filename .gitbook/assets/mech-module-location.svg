<g transform="translate(139.0,243.0) rotate(0.0)"><rect x="-7.0" y="-17.0" width="14.0" height="34.0" rx="4" fill="#1f2933" stroke="#1f2933" stroke-width="0" /><path d="M-4,-9.0 L0,-15.0 L4,-9.0 Z" fill="#ffffff"/></g>
<g transform="translate(261.0,243.0) rotate(0.0)"><rect x="-7.0" y="-17.0" width="14.0" height="34.0" rx="4" fill="#1f2933" stroke="#1f2933" stroke-width="0" /><path d="M-4,-9.0 L0,-15.0 L4,-9.0 Z" fill="#ffffff"/></g>
<rect x="430.0" y="96.0" width="296.0" height="168.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<text x="444.0" y="118.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >withLocation(front, left) in meters</text>
<text x="444.0" y="144.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >front left</text>
<text x="712.0" y="144.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2933" font-family="Consolas, Menlo, monospace">( 0.3,  0.3)</text>
<text x="444.0" y="166.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >front right</text>
<text x="712.0" y="166.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2933" font-family="Consolas, Menlo, monospace">( 0.3, -0.3)</text>
<text x="444.0" y="188.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >back left</text>
<text x="712.0" y="188.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2933" font-family="Consolas, Menlo, monospace">(-0.3,  0.3)</text>
<text x="444.0" y="210.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >back right</text>
<text x="712.0" y="210.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2933" font-family="Consolas, Menlo, monospace">(-0.3, -0.3)</text>
<text x="444.0" y="240.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >Front is positive X. Left is positive Y.</text>
<text x="444.0" y="256.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >Right and back are negative.</text>
<text x="34.0" y="302.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >The kinematics are built from these four numbers. A wrong sign makes the robot spin when it should drive.</text>
</svg>
