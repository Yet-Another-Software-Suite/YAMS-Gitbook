<line x1="380.0" y1="200.9" x2="380.0" y2="157.2" stroke="#d64545" stroke-width="4.4" stroke-linecap="round"/><circle cx="380.0" cy="157.2" r="5.5" fill="#d64545"/><text x="394.0" y="162.2" font-size="14" font-weight="700" text-anchor="middle" fill="#d64545" >X</text>
<line x1="374.3" y1="226.5" x2="336.5" y2="244.9" stroke="#3e6da8" stroke-width="2.8" stroke-linecap="round"/><circle cx="336.5" cy="244.9" r="4.2" fill="#3e6da8"/><text x="323.5" y="249.9" font-size="14" font-weight="700" text-anchor="middle" fill="#3e6da8" >Z</text>
<path d="M360.0,181.2 A22,9 0 1 0 400.0,181.2" fill="none" stroke="#d64545" stroke-width="1.8" marker-end="url(#turnX)"/>
<text x="380.0" y="330.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2933" >X points up</text>
<text x="380.0" y="345.0" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >turning the robot is the gyro's roll</text>
<text x="380.0" y="360.0" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >Y points to the robot's left</text>
<rect x="498" y="84" width="228" height="290" rx="8" fill="#fafbfc" stroke="#cbd2d9"/>
<text x="512.0" y="108.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" >Gyro on its side, Y up</text>
<text x="512.0" y="126.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#6b46c1" font-family="Consolas, Menlo, monospace">GyroAxis.PITCH</text>
<polygon points="612.0,292.8 687.4,256.0 687.4,246.5 612.0,283.3" fill="#dfe4ea" stroke="#52606d" stroke-width="1.4" stroke-linejoin="round"/>
