<text x="239.8" y="255.2" font-size="10" font-weight="700" text-anchor="middle" fill="#52606d" >front</text>
<line x1="167.7" y1="230.2" x2="205.4" y2="211.8" stroke="#d64545" stroke-width="2.8" stroke-linecap="round"/><circle cx="205.4" cy="211.8" r="4.2" fill="#d64545"/><text x="218.4" y="216.8" font-size="14" font-weight="700" text-anchor="middle" fill="#d64545" >X</text>
<line x1="128.3" y1="230.2" x2="90.6" y2="211.8" stroke="#147d6f" stroke-width="2.8" stroke-linecap="round"/><circle cx="90.6" cy="211.8" r="4.2" fill="#147d6f"/><text x="77.6" y="216.8" font-size="14" font-weight="700" text-anchor="middle" fill="#147d6f" >Y</text>
<polygon points="148.0,265.7 108.6,246.5 108.6,233.2 148.0,252.4" fill="#2a333d" stroke="#11161b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="148.0,265.7 187.4,246.5 187.4,233.2 148.0,252.4" fill="#2a333d" stroke="#11161b" stroke-width="1.2" stroke-linejoin="round"/>
