<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Which gyro axis points up?</title>
<desc id="d">Three drawings of a robot chassis with the gyro's X, Y and Z axes. Mounted flat, Z points up, X points to the front and Y to the left: use GyroAxis.YAW. On its side with X pointing up, Y points to the robot's left and Z to the back: use GyroAxis.ROLL. On its side with Y pointing up, X points to the robot's front and Z to the right: use GyroAxis.PITCH.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
<rect width="760" height="424" fill="#f5f7fa"/>
<rect x="16" y="16" width="728" height="392" rx="10" fill="#ffffff" stroke="#cbd2d9"/>
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >Which gyro axis points up?</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The dark box is the gyro. Its X, Y and Z axes are printed on most gyros: find the one pointing at the ceiling.</text>
<defs><marker id="turnX" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker></defs><defs><marker id="turnY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker></defs><defs><marker id="turnZ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs><rect x="34" y="84" width="228" height="290" rx="8" fill="#fafbfc" stroke="#cbd2d9"/>
<text x="48.0" y="108.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" >Gyro mounted flat</text>
<text x="48.0" y="126.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#6b46c1" font-family="Consolas, Menlo, monospace">GyroAxis.YAW</text>
<polygon points="148.0,292.8 223.4,256.0 223.4,246.5 148.0,283.3" fill="#dfe4ea" stroke="#52606d" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="148.0,292.8 72.6,256.0 72.6,246.5 148.0,283.3" fill="#cfd6de" stroke="#52606d" stroke-width="1.4" stroke-linejoin="round"/>
