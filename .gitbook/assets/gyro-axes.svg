<line x1="148.0" y1="233.2" x2="148.0" y2="189.5" stroke="#3e6da8" stroke-width="4.4" stroke-linecap="round"/><circle cx="148.0" cy="189.5" r="5.5" fill="#3e6da8"/><text x="162.0" y="194.5" font-size="14" font-weight="700" text-anchor="middle" fill="#3e6da8" >Z</text>
<path d="M128.0,213.5 A22,9 0 1 0 168.0,213.5" fill="none" stroke="#3e6da8" stroke-width="1.8" marker-end="url(#turnZ)"/>
<text x="148.0" y="330.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2933" >Z points up</text>
<text x="148.0" y="345.0" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >turning the robot is the gyro's yaw</text>
<text x="148.0" y="360.0" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >this is the default</text>
<rect x="266" y="84" width="228" height="290" rx="8" fill="#fafbfc" stroke="#cbd2d9"/>
