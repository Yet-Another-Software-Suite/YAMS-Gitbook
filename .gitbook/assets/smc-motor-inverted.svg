<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withMotorInverted</title>
<desc id="d">Two motors given the same positive 6 volts. Without inversion the motor turns one way and the position counts up in that direction. With inversion it turns the other way and the position counts up that way instead.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="286" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="254.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withMotorInverted</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Which way the motor turns for a positive output. The encoder follows it.</text>
<rect x="34.0" y="84.0" width="338.0" height="152.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >withMotorInverted(false)</text>
<circle cx="134.0" cy="164.0" r="38" fill="#dbe7f5" stroke="#3e6da8" stroke-width="2.4" />
<circle cx="134.0" cy="164.0" r="6" fill="#1f2933" stroke="none" stroke-width="1.6" />
<path d="M173.8,197.4 A52,52 0 0 0 100.6,124.2" fill="none" stroke="#c2630b" stroke-width="2.6" marker-end="url(#ao)"/>
<text x="212.0" y="138.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">setVoltage(+6 V)</text>
<text x="212.0" y="160.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" >turns counter-clockwise</text>
<text x="212.0" y="180.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >position counts up</text>
<text x="212.0" y="198.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >this way</text>
<rect x="388.0" y="84.0" width="338.0" height="152.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="400.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" >withMotorInverted(true)</text>
<circle cx="488.0" cy="164.0" r="38" fill="#dbe7f5" stroke="#3e6da8" stroke-width="2.4" />
<circle cx="488.0" cy="164.0" r="6" fill="#1f2933" stroke="none" stroke-width="1.6" />
<path d="M448.2,197.4 A52,52 0 0 1 521.4,124.2" fill="none" stroke="#c2630b" stroke-width="2.6" marker-end="url(#ao)"/>
<text x="566.0" y="138.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">setVoltage(+6 V)</text>
<text x="566.0" y="160.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" >turns clockwise</text>
<text x="566.0" y="180.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >position counts up</text>
<text x="566.0" y="198.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >this way instead</text>
<text x="34.0" y="262.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Set it so a positive output moves the mechanism in the direction you call positive: up, out, or counter-clockwise.</text>
</svg>
