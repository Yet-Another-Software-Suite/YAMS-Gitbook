<text x="366.0" y="228.0" font-size="11" font-weight="700" text-anchor="middle" fill="#147d6f" >mechanism</text>
<line x1="410.0" y1="166.0" x2="454.0" y2="166.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
