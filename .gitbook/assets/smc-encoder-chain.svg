<text x="518.0" y="160.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2933" >encoder gearing</text>
<text x="518.0" y="177.0" font-size="8.2" font-weight="400" text-anchor="middle" fill="#52606d" >withExternalEncoderGearing</text>
<line x1="582.0" y1="166.0" x2="620.0" y2="166.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<circle cx="662.0" cy="166.0" r="34" fill="#e4dcf7" stroke="#6b46c1" stroke-width="2.2" />
<text x="662.0" y="162.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#6b46c1" >external</text>
<text x="662.0" y="177.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#6b46c1" >encoder</text>
<text x="40.0" y="96.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#52606d" >relative: starts at 0 each boot</text>
<text x="662.0" y="122.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >often absolute: remembers</text>
<text x="662.0" y="220.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >withExternalEncoder</text>
<text x="34.0" y="262.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >The built in encoder is always there. An external encoder is optional, and usually sits on or near the mechanism.</text>
</svg>
