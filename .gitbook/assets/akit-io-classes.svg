<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">One IO class for the real robot and simulation</title>
<desc id="d">Two diagrams of a subsystem, its IO interface and the classes that implement it. Traditional AdvantageKit needs three IO classes for each mechanism: one with your motor and encoder code for the real robot, one with your physics simulation, and an empty one for log replay. With YAMS there are two: one class used on the real robot and in simulation, because the YAMS mechanism under it simulates itself, and the empty one for log replay.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="408" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="376.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >One IO class for the real robot and simulation</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >AdvantageKit puts an IO interface between a subsystem and its hardware. YAMS removes one of the classes behind it.</text>
<rect x="34.0" y="78.0" width="332.0" height="300.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="98.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" >Traditional AdvantageKit</text>
<rect x="120.0" y="108.0" width="160.0" height="36.0" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<text x="200.0" y="131.2" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >ArmSubsystem</text>
<line x1="200.0" y1="146.0" x2="200.0" y2="164.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="120.0" y="168.0" width="160.0" height="36.0" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6" />
<text x="200.0" y="191.2" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >ArmIO interface</text>
<line x1="200.0" y1="206.0" x2="93.0" y2="232.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="44.0" y="236.0" width="98.0" height="52.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<text x="93.0" y="259.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >ArmIOReal</text>
<text x="93.0" y="274.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >real hardware</text>
<line x1="200.0" y1="206.0" x2="200.0" y2="232.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="151.0" y="236.0" width="98.0" height="52.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<text x="200.0" y="259.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >ArmIOSim</text>
<text x="200.0" y="274.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >physics sim</text>
<line x1="200.0" y1="206.0" x2="307.0" y2="232.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="258.0" y="236.0" width="98.0" height="52.0" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.6" />
<text x="307.0" y="259.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >ArmIOReplay</text>
<text x="307.0" y="274.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >log replay</text>
<text x="200.0" y="368.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#c2630b" >3 IO classes for each mechanism</text>
<rect x="394.0" y="78.0" width="332.0" height="300.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="406.0" y="98.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >With YAMS</text>
<rect x="480.0" y="108.0" width="160.0" height="36.0" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<text x="560.0" y="131.2" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >ArmSubsystem</text>
<line x1="560.0" y1="146.0" x2="560.0" y2="164.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="480.0" y="168.0" width="160.0" height="36.0" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6" />
<text x="560.0" y="191.2" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >ArmIO interface</text>
<line x1="560.0" y1="206.0" x2="478.0" y2="232.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="404.0" y="236.0" width="148.0" height="52.0" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="478.0" y="259.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >ArmIOTalonFX</text>
<text x="478.0" y="274.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >real robot and simulation</text>
<line x1="560.0" y1="206.0" x2="642.0" y2="232.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="568.0" y="236.0" width="148.0" height="52.0" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.6" />
<text x="642.0" y="259.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >ArmIOReplay</text>
<text x="642.0" y="274.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >empty, for log replay</text>
<line x1="478.0" y1="290.0" x2="478.0" y2="306.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="404.0" y="310.0" width="148.0" height="40.0" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="478.0" y="327.2" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2933" >YAMS mechanism</text>
<text x="478.0" y="341.8" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >simulates itself</text>
<text x="560.0" y="368.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#147d6f" >2 IO classes for each mechanism</text>
</svg>
