<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The gyro options</title>
<desc id="d">Three panels showing a robot turned 30 degrees counter-clockwise. With withGyro alone the heading reads plus 30 degrees. With withGyroInverted the same turn reads minus 30 degrees. With withGyroOffset of 90 degrees the heading reads 90 degrees different.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="314" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="282.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >The gyro options</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The same turn to the left, read three ways.</text>
<rect x="34.0" y="84.0" width="220.0" height="180.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >withGyro</text>
<circle cx="144.0" cy="178.0" r="58" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" />
<line x1="144.0" y1="120.0" x2="144.0" y2="132.0" stroke="#52606d" stroke-width="1.6" stroke-linecap="round"/>
<text x="144.0" y="114.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >0</text>
<g transform="translate(144.0,178.0) rotate(-30.0)">
<rect x="-22.0" y="-22.0" width="44.0" height="44.0" rx="6" fill="#dbe7f5" stroke="#3e6da8" stroke-width="2" />
<path d="M-8,-10.0 L0,-19.0 L8,-10.0 Z" fill="#3e6da8"/>
</g>
<path d="M144.0,108.0 A70,70 0 0 0 109.0,117.4" fill="none" stroke="#c2630b" stroke-width="2.4" marker-end="url(#ao)"/>
<text x="144.0" y="256.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#147d6f" >heading +30 deg</text>
<rect x="270.0" y="84.0" width="220.0" height="180.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="282.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#d64545" >withGyroInverted(true)</text>
<circle cx="380.0" cy="178.0" r="58" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" />
<line x1="380.0" y1="120.0" x2="380.0" y2="132.0" stroke="#52606d" stroke-width="1.6" stroke-linecap="round"/>
<text x="380.0" y="114.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >0</text>
<g transform="translate(380.0,178.0) rotate(-30.0)">
<rect x="-22.0" y="-22.0" width="44.0" height="44.0" rx="6" fill="#dbe7f5" stroke="#3e6da8" stroke-width="2" />
<path d="M-8,-10.0 L0,-19.0 L8,-10.0 Z" fill="#3e6da8"/>
</g>
<path d="M380.0,108.0 A70,70 0 0 0 345.0,117.4" fill="none" stroke="#c2630b" stroke-width="2.4" marker-end="url(#ao)"/>
<text x="380.0" y="256.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#d64545" >the same turn reads -30 deg</text>
<rect x="506.0" y="84.0" width="220.0" height="180.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="518.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#6b46c1" >withGyroOffset(Degrees.of(90))</text>
<circle cx="616.0" cy="178.0" r="58" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.4" />
<line x1="616.0" y1="120.0" x2="616.0" y2="132.0" stroke="#52606d" stroke-width="1.6" stroke-linecap="round"/>
<text x="616.0" y="114.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >0</text>
<g transform="translate(616.0,178.0) rotate(-30.0)">
<rect x="-22.0" y="-22.0" width="44.0" height="44.0" rx="6" fill="#dbe7f5" stroke="#3e6da8" stroke-width="2" />
<path d="M-8,-10.0 L0,-19.0 L8,-10.0 Z" fill="#3e6da8"/>
</g>
<path d="M616.0,108.0 A70,70 0 0 0 581.0,117.4" fill="none" stroke="#c2630b" stroke-width="2.4" marker-end="url(#ao)"/>
<text x="616.0" y="256.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#6b46c1" >reads 90 deg different</text>
<text x="34.0" y="290.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Counter-clockwise must read positive. If the heading goes down when the robot turns left, invert the gyro.</text>
</svg>
