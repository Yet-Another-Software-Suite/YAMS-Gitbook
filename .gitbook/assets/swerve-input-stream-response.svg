<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" width="760" height="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How each option reshapes the stick</title>
<desc id="d">A graph of output against stick position with four curves. No shaping is a straight line. A 0.05 deadband gives no output until 5 percent and then rises to full. Deadband plus cube stays low near the center and rises steeply near the edge. Deadband plus a 0.5 scale is a straight line that tops out at half speed.</desc>
