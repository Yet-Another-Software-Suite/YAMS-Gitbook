<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">An arm with a brake</title>
<desc id="d">Four stages: when the motor drives, the brake lets go, by itself or on command; the arm moves with runTo; when the motor stops driving, the brake bites and holds the arm; then the motor output is zero, so it draws no current and makes no heat. A graph of motor current shows a spike while moving, a steady holding current until the brake bites, and then almost none, where an arm without a brake would draw holding current forever.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="336" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="304.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >An arm with a brake</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The brake holds the arm so the motor does not have to.</text>
<rect x="34.0" y="92.0" width="164.0" height="66.0" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.6" />
<text x="116.0" y="114.0" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2933" >1. Drive</text>
<text x="116.0" y="132.0" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2933" font-family="Consolas, Menlo, monospace">the brake lets go</text>
<text x="116.0" y="148.0" font-size="9.6" font-weight="400" text-anchor="middle" fill="#52606d" >by itself, or on command</text>
<line x1="200.0" y1="125.0" x2="208.0" y2="125.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="210.0" y="92.0" width="164.0" height="66.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<text x="292.0" y="114.0" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2933" >2. Move</text>
<text x="292.0" y="132.0" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2933" font-family="Consolas, Menlo, monospace">runTo(angle)</text>
<text x="292.0" y="148.0" font-size="9.6" font-weight="400" text-anchor="middle" fill="#52606d" >the motor does the work</text>
<line x1="376.0" y1="125.0" x2="384.0" y2="125.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="386.0" y="92.0" width="164.0" height="66.0" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="468.0" y="114.0" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2933" >3. Stop driving</text>
<text x="468.0" y="132.0" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2933" font-family="Consolas, Menlo, monospace">the brake bites</text>
<text x="468.0" y="148.0" font-size="9.6" font-weight="400" text-anchor="middle" fill="#52606d" >and holds the arm</text>
<line x1="552.0" y1="125.0" x2="560.0" y2="125.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="562.0" y="92.0" width="164.0" height="66.0" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<text x="644.0" y="114.0" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2933" >4. Rest</text>
<text x="644.0" y="132.0" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2933" font-family="Consolas, Menlo, monospace">motor output 0</text>
<text x="644.0" y="148.0" font-size="9.6" font-weight="400" text-anchor="middle" fill="#52606d" >no current, no heat</text>
<rect x="34.0" y="176.0" width="692.0" height="110.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<line x1="48.0" y1="266.0" x2="712.0" y2="266.0" stroke="#cbd2d9" stroke-width="1.2" stroke-linecap="round"/>
<line x1="48.0" y1="202.0" x2="48.0" y2="266.0" stroke="#cbd2d9" stroke-width="1.2" stroke-linecap="round"/>
<text x="46.0" y="193.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >motor current</text>
<text x="714.0" y="279.0" font-size="10" font-weight="400" text-anchor="end" fill="#52606d" >time</text>
