<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Arm or Pivot</title>
<desc id="d">Two panels. An Arm accounts for gravity: it swings up and down, needs kG to hold and uses ArmFeedforward. A Pivot does not account for gravity: it is for a vertical axis or a balanced wrist, has no kG and uses SimpleMotorFeedforward.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="310" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="278.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >Arm or Pivot</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The difference is whether the mechanism accounts for gravity.</text>
<rect x="34.0" y="84.0" width="338.0" height="176.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" >Arm: accounts for gravity</text>
<rect x="388.0" y="84.0" width="338.0" height="176.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="400.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >Pivot: does not account for gravity</text>
<line x1="80.0" y1="218.0" x2="270.0" y2="218.0" stroke="#cbd2d9" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="120.0" y1="218.0" x2="220.0" y2="158.0" stroke="#3e6da8" stroke-width="9" stroke-linecap="round"/>
<circle cx="120.0" cy="218.0" r="7" fill="#1f2933" stroke="none" stroke-width="1.6" />
<line x1="220.0" y1="158.0" x2="220.0" y2="200.0" stroke="#d64545" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="250.0" y="130.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >swings up and down</text>
<text x="250.0" y="148.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" >needs kG to hold</text>
<text x="250.0" y="172.0" font-size="10" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">ArmFeedforward</text>
<text x="250.0" y="196.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >use Arm</text>
<circle cx="478.0" cy="178.0" r="52" fill="#d5f0ea" stroke="#147d6f" stroke-width="2.2" />
<line x1="478.0" y1="178.0" x2="522.0" y2="158.0" stroke="#3e6da8" stroke-width="9" stroke-linecap="round"/>
<circle cx="478.0" cy="178.0" r="7" fill="#1f2933" stroke="none" stroke-width="1.6" />
<path d="M533.4,146.0 A64,64 0 0 0 422.6,146.0" fill="none" stroke="#c2630b" stroke-width="2" marker-end="url(#ao)"/>
<text x="478.0" y="252.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >seen from above</text>
<text x="590.0" y="130.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >for a vertical axis,</text>
<text x="590.0" y="146.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >or a balanced wrist</text>
<text x="590.0" y="168.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#147d6f" >has no kG</text>
<text x="590.0" y="192.0" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">SimpleMotorFeedforward</text>
<text x="590.0" y="216.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >use Pivot</text>
<text x="34.0" y="286.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Turrets and balanced wrists are pivots. If it needs voltage to hold itself up, use an Arm.</text>
</svg>
