<path d="M-8,-1.0 L0,-10.0 L8,-1.0 Z" fill="#3e6da8"/>
</g>
<text x="557.0" y="122.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#147d6f" >stays on the line</text>
<text x="34.0" y="296.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Driving and spinning at once bends the path, because the wheels are only updated every loop. This corrects for it.</text>
</svg>
