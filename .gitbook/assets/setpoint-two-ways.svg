<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" width="760" height="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Two ways to give a mechanism a setpoint</title>
<desc id="d">Two paths to the same SmartMotorController. A command helper such as arm.run returns a Command that requires the subsystem; a button binding or auto sequence schedules it, and the scheduler stops it when another command needs the mechanism. A direct setpoint method such as arm.setMechanismPositionSetpoint returns nothing and sets the target at once; it is called from your own code, such as a custom command, an IO class or a state machine, and nothing is scheduled.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="358" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="326.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >Two ways to give a mechanism a setpoint</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Both end at the same motor controller. They differ in who is in charge of the call.</text>
<rect x="34.0" y="78.0" width="336.0" height="250.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="98.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >Command helper</text>
<rect x="54.0" y="108.0" width="296.0" height="40.0" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<text x="202.0" y="125.2" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >Button binding or auto sequence</text>
<text x="202.0" y="140.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" font-family="Consolas, Menlo, monospace">controller.a().whileTrue(...)</text>
<line x1="202.0" y1="150.0" x2="202.0" y2="166.0" stroke="#147d6f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"/>
<rect x="54.0" y="170.0" width="296.0" height="46.0" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="202.0" y="190.5" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2933" >arm.run(Degrees.of(45))</text>
<text x="202.0" y="205.5" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >returns a Command that requires the subsystem</text>
<line x1="202.0" y1="218.0" x2="202.0" y2="234.0" stroke="#147d6f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"/>
<rect x="54.0" y="238.0" width="296.0" height="40.0" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.6" />
<text x="202.0" y="255.2" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >SmartMotorController</text>
<text x="202.0" y="270.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >closed loop to 45°</text>
<text x="202.0" y="304.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >The scheduler runs it, and stops it when another</text>
<text x="202.0" y="318.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >command needs the mechanism.</text>
<rect x="390.0" y="78.0" width="336.0" height="250.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="402.0" y="98.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" >Direct setpoint method</text>
<rect x="410.0" y="108.0" width="296.0" height="40.0" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<text x="558.0" y="125.2" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >Your own code</text>
<text x="558.0" y="140.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >a custom command, an IO class, a state machine</text>
<line x1="558.0" y1="150.0" x2="558.0" y2="166.0" stroke="#c2630b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ao)"/>
<rect x="410.0" y="170.0" width="296.0" height="46.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<text x="558.0" y="190.2" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >arm.setMechanismPositionSetpoint(...)</text>
<text x="558.0" y="205.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >returns nothing, and sets the target at once</text>
<line x1="558.0" y1="218.0" x2="558.0" y2="234.0" stroke="#c2630b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ao)"/>
<rect x="410.0" y="238.0" width="296.0" height="40.0" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.6" />
<text x="558.0" y="255.2" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >SmartMotorController</text>
<text x="558.0" y="270.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >closed loop to 45°</text>
<text x="558.0" y="304.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >Nothing is scheduled. Requirements and when to</text>
<text x="558.0" y="318.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >call it are up to your code.</text>
</svg>
