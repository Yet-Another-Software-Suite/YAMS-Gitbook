<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What the LQR settings do</title>
<desc id="d">Three step responses. Gentle, with a position tolerance of 0.2 radians and a control effort of 12 volts, is slow and uses little voltage. Balanced, with a tolerance of 0.1 radians, is quick and settles cleanly. Aggressive, with a tolerance of 0.02 radians and a control effort of 6 volts, is the fastest, overshoots slightly and saturates the motor.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
<rect width="760" height="362" fill="#f5f7fa"/>
