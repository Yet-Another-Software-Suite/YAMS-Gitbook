<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">AdvantageScope: turn on tuning mode first</title>
<desc id="d">A schematic of the AdvantageScope sidebar. Step 1: click the tuning mode button, a sliders icon beside the search box. Step 2: type a new value into a field under NT Tuning, such as closedloop feedback kP.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
<rect width="760" height="314" fill="#f5f7fa"/>
<rect x="16" y="16" width="728" height="282" rx="10" fill="#ffffff" stroke="#cbd2d9"/>
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >AdvantageScope: turn on tuning mode first</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >AdvantageScope is read-only until you tell it otherwise. Schematic, not a screenshot.</text>
<rect x="34" y="84" width="304" height="206" rx="8" fill="#fafbfc" stroke="#cbd2d9"/>
<rect x="46" y="96" width="236" height="30" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="58.0" y="116.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Search</text>
<rect x="292" y="96" width="32" height="30" rx="6" fill="#6b46c1"/>
<rect x="288" y="92" width="40" height="38" rx="9" fill="none" stroke="#d64545" stroke-width="2.2"/>
<line x1="298" y1="104" x2="318" y2="104" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="304.0" cy="104" r="2.8" fill="#6b46c1" stroke="#ffffff" stroke-width="1.5"/>
<line x1="298" y1="111" x2="318" y2="111" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="312.0" cy="111" r="2.8" fill="#6b46c1" stroke="#ffffff" stroke-width="1.5"/>
<line x1="298" y1="118" x2="318" y2="118" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="307.0" cy="118" r="2.8" fill="#6b46c1" stroke="#ffffff" stroke-width="1.5"/>
<text x="52.0" y="152.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">Tuning</text>
<text x="68.0" y="172.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">Arm</text>
<text x="84.0" y="192.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">ArmMotor</text>
<text x="100.0" y="212.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">closedloop</text>
<text x="116.0" y="232.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">feedback</text>
<text x="132.0" y="252.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kP</text>
<rect x="246" y="238" width="74" height="20" rx="4" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6"/>
<text x="312.0" y="252.0" font-size="11.5" font-weight="700" text-anchor="end" fill="#6b46c1" font-family="Consolas, Menlo, monospace">6.0</text>
<text x="132.0" y="272.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kD</text>
<rect x="246" y="258" width="74" height="20" rx="4" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6"/>
<text x="312.0" y="272.0" font-size="11.5" font-weight="700" text-anchor="end" fill="#6b46c1" font-family="Consolas, Menlo, monospace">0.2</text>
<circle cx="378" cy="111" r="11" fill="#d64545"/>
<text x="378.0" y="115.0" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" >1</text>
<line x1="366" y1="111" x2="332" y2="111" stroke="#d64545" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="398.0" y="108.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#1f2933" >Click the tuning mode button</text>
<text x="398.0" y="126.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The sliders icon beside the search box. It only</text>
<text x="398.0" y="141.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >appears while AdvantageScope is connected live.</text>
<circle cx="378" cy="252" r="11" fill="#6b46c1"/>
<text x="378.0" y="256.0" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff" >2</text>
<line x1="366" y1="252" x2="324" y2="252" stroke="#6b46c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="398.0" y="249.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#1f2933" >Type a new value</text>
<text x="398.0" y="267.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Fields under NT:/Tuning can now be edited.</text>
<text x="398.0" y="196.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >Until the button is on, AdvantageScope only reads</text>
<text x="398.0" y="211.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >NetworkTables and your edits go nowhere.</text>
</svg>
