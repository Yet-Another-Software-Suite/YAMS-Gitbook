<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 454" width="760" height="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tune in this order</title>
<desc id="d">Flywheel tuning order: kS, then kV with kP at zero, then kP, then kD if it oscillates, then optionally kA. Arm and elevator tuning order: kG, then kS, then kP with small moves, then kD if it overshoots, and the motion profile last: add its limits, then tune kV until the velocity tracks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
<rect width="760" height="454" fill="#f5f7fa"/>
<rect x="16" y="16" width="728" height="422" rx="10" fill="#ffffff" stroke="#cbd2d9"/>
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >Tune in this order</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Feedforward first, then feedback, then the motion profile. One value at a time.</text>
<text x="34.0" y="100.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" >Flywheel</text>
<text x="102.8" y="100.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >SimpleMotorFeedforward, no motion profile</text>
<rect x="34.0" y="112" width="125.6" height="74" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.5"/>
<circle cx="51.0" cy="130" r="10" fill="#147d6f"/>
<text x="51.0" y="134.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff" >1</text>
<text x="68.0" y="135.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >kS</text>
<text x="44.0" y="158.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >raise until the wheel</text>
<text x="44.0" y="173.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >just starts to move</text>
<line x1="161.6" y1="149" x2="173.6" y2="149" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="175.6" y="112" width="125.6" height="74" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.5"/>
<circle cx="192.6" cy="130" r="10" fill="#147d6f"/>
<text x="192.6" y="134.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff" >2</text>
<text x="209.6" y="135.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >kV</text>
<text x="185.6" y="158.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >with kP = 0, raise until</text>
<text x="185.6" y="173.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >speed matches setpoint</text>
<line x1="303.2" y1="149" x2="315.2" y2="149" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="317.2" y="112" width="125.6" height="74" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.5"/>
<circle cx="334.2" cy="130" r="10" fill="#147d6f"/>
<text x="334.2" y="134.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff" >3</text>
<text x="351.2" y="135.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >kP</text>
<text x="327.2" y="158.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >tighten the response,</text>
<text x="327.2" y="173.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >remove leftover error</text>
<line x1="444.79999999999995" y1="149" x2="456.79999999999995" y2="149" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="458.8" y="112" width="125.6" height="74" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.5"/>
<circle cx="475.8" cy="130" r="10" fill="#147d6f"/>
<text x="475.8" y="134.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff" >4</text>
<text x="492.8" y="135.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >kD</text>
<text x="468.8" y="158.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >only if it</text>
<text x="468.8" y="173.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >oscillates</text>
<line x1="586.4" y1="149" x2="598.4" y2="149" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.4" y="112" width="125.6" height="74" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.5"/>
<circle cx="617.4" cy="130" r="10" fill="#147d6f"/>
<text x="617.4" y="134.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff" >5</text>
<text x="634.4" y="135.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >kA</text>
<text x="610.4" y="158.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >optional: faster</text>
<text x="610.4" y="173.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >spin up</text>
<text x="34.0" y="220.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" >Arm</text>
<text x="64.8" y="220.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >ArmFeedforward, then a motion profile</text>
<rect x="34.0" y="232" width="125.6" height="74" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.5"/>
<circle cx="51.0" cy="250" r="10" fill="#3e6da8"/>
<text x="51.0" y="254.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff" >1</text>
<text x="68.0" y="255.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >kG</text>
<text x="44.0" y="278.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >hold the arm level,</text>
<text x="44.0" y="293.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >raise until it stays</text>
<line x1="161.6" y1="269" x2="173.6" y2="269" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="175.6" y="232" width="125.6" height="74" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.5"/>
<circle cx="192.6" cy="250" r="10" fill="#3e6da8"/>
<text x="192.6" y="254.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff" >2</text>
<text x="209.6" y="255.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >kS</text>
<text x="185.6" y="278.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >raise until it is just</text>
<text x="185.6" y="293.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >about to move</text>
<line x1="303.2" y1="269" x2="315.2" y2="269" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="317.2" y="232" width="125.6" height="74" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.5"/>
<circle cx="334.2" cy="250" r="10" fill="#3e6da8"/>
<text x="334.2" y="254.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff" >3</text>
<text x="351.2" y="255.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >kP</text>
<text x="327.2" y="278.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >small moves: quick,</text>
<text x="327.2" y="293.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >no oscillation</text>
<line x1="444.79999999999995" y1="269" x2="456.79999999999995" y2="269" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="458.8" y="232" width="125.6" height="74" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.5"/>
<circle cx="475.8" cy="250" r="10" fill="#3e6da8"/>
<text x="475.8" y="254.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff" >4</text>
<text x="492.8" y="255.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >kD</text>
<text x="468.8" y="278.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >only if it</text>
<text x="468.8" y="293.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >overshoots</text>
<line x1="586.4" y1="269" x2="598.4" y2="269" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.4" y="232" width="125.6" height="74" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.5"/>
<circle cx="617.4" cy="250" r="10" fill="#3e6da8"/>
<text x="617.4" y="254.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff" >5</text>
<text x="634.4" y="255.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >Profile</text>
<text x="610.4" y="278.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >last: add limits, then</text>
<text x="610.4" y="293.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >kV until velocity tracks</text>
<text x="34.0" y="340.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f2933" >Elevator</text>
<text x="102.8" y="340.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >ElevatorFeedforward, then a motion profile</text>
<rect x="34.0" y="352" width="125.6" height="74" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.5"/>
