<text x="209.6" y="375.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >kS</text>
<text x="185.6" y="398.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >raise until it is just</text>
<text x="185.6" y="413.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >about to move</text>
<line x1="303.2" y1="389" x2="315.2" y2="389" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="317.2" y="352" width="125.6" height="74" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.5"/>
<circle cx="334.2" cy="370" r="10" fill="#6b46c1"/>
<text x="334.2" y="374.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff" >3</text>
<text x="351.2" y="375.0" font-size="14.5" font-weight="700" text-anchor="start" fill="#1f2933" >kP</text>
<text x="327.2" y="398.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >small moves: quick,</text>
<text x="327.2" y="413.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >no oscillation</text>
