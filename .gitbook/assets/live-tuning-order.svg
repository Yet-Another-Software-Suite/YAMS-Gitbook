<text x="44.0" y="398.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >raise until the</text>
<text x="44.0" y="413.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >carriage holds height</text>
