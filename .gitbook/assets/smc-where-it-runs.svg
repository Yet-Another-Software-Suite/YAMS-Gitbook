<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >Where the closed loop controller runs</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >It depends on the vendor and on what you asked for.</text>
<text x="214.0" y="100.0" font-size="11" font-weight="700" text-anchor="start" fill="#147d6f" >runs on the motor controller</text>
<text x="482.0" y="100.0" font-size="11" font-weight="700" text-anchor="start" fill="#c2630b" >runs on the SystemCore</text>
<text x="34.0" y="133.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >TalonFX, TalonFXS</text>
<rect x="214.0" y="110.0" width="256.0" height="36.0" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.4" />
<text x="342.0" y="132.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2933" >PID and profiles</text>
<rect x="482.0" y="110.0" width="244.0" height="36.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.4" />
<text x="604.0" y="132.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2933" >LQR</text>
<text x="34.0" y="177.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >SPARK MAX, SPARK Flex</text>
<rect x="214.0" y="154.0" width="256.0" height="36.0" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.4" />
<text x="342.0" y="176.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2933" >PID and trapezoidal profiles</text>
<rect x="482.0" y="154.0" width="244.0" height="36.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.4" />
<text x="604.0" y="176.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2933" >exponential profiles, LQR</text>
<text x="34.0" y="221.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Thrifty Nova</text>
<rect x="482.0" y="198.0" width="244.0" height="36.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.4" />
<text x="604.0" y="220.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2933" >everything</text>
<text x="34.0" y="266.0" font-size="11" font-weight="700" text-anchor="start" fill="#1f2933" >withClosedLoopControlPeriod only changes the SystemCore loop:</text>
<text x="34.0" y="292.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >20 ms (the default)</text>
