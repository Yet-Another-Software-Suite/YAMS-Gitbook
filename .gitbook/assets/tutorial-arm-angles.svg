<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The angles in this tutorial</title>
<desc id="d">A side view of the arm and the angles used in this tutorial. The hard limits are minus 30 and 40 degrees: where the arm physically stops, set on ArmConfig and used by the simulation. The soft limits are minus 20 and 30 degrees: as far as the closed loop will go, set on SmartMotorControllerConfig. Inside them are the setpoints: minus 5 degrees for the A button, which is also where the arm starts, 15 degrees for the B button, and 0 degrees for the default command.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="460" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="428.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >The angles in this tutorial</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >0° is horizontal, and positive angles are up.</text>
<line x1="210.0" y1="296.0" x2="456.0" y2="296.0" stroke="#cbd2d9" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="466.0" y="300.0" font-size="11" font-weight="700" text-anchor="start" fill="#147d6f" >0°  default command</text>
<path d="M419.7,394.0 A196,196 0 0 0 400.1,170.0" fill="none" stroke="#d64545" stroke-width="2.2" stroke-dasharray="6 4"/>
<line x1="409.3" y1="388.0" x2="430.1" y2="400.0" stroke="#d64545" stroke-width="2.6" stroke-linecap="round"/>
<line x1="391.0" y1="177.7" x2="409.3" y2="162.3" stroke="#d64545" stroke-width="2.6" stroke-linecap="round"/>
<text x="415.5" y="161.2" font-size="11" font-weight="700" text-anchor="start" fill="#d64545" >40° hard limit</text>
<text x="437.1" y="414.0" font-size="11" font-weight="700" text-anchor="start" fill="#d64545" >-30° hard limit</text>
<path d="M417.3,356.9 A178,178 0 0 0 404.2,207.0" fill="none" stroke="#c2630b" stroke-width="5"/>
<text x="437.1" y="192.0" font-size="11" font-weight="700" text-anchor="start" fill="#c2630b" >30° soft limit</text>
<text x="453.0" y="377.9" font-size="11" font-weight="700" text-anchor="start" fill="#c2630b" >-20° soft limit</text>
<line x1="250.0" y1="296.0" x2="414.2" y2="252.0" stroke="#147d6f" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
<circle cx="414.2" cy="252.0" r="5" fill="#147d6f" stroke="none" stroke-width="1.6" />
<text x="458.6" y="244.1" font-size="11" font-weight="700" text-anchor="start" fill="#147d6f" >15°  B button</text>
<line x1="250.0" y1="296.0" x2="420.0" y2="296.0" stroke="#147d6f" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
<circle cx="420.0" cy="296.0" r="5" fill="#147d6f" stroke="none" stroke-width="1.6" />
<line x1="250.0" y1="296.0" x2="419.4" y2="310.8" stroke="#3e6da8" stroke-width="9" stroke-linecap="round"/>
<circle cx="419.4" cy="310.8" r="5" fill="#147d6f" stroke="none" stroke-width="1.6" />
<text x="465.2" y="326.8" font-size="11" font-weight="700" text-anchor="start" fill="#3e6da8" >-5°  A button, and where the arm starts</text>
<circle cx="250.0" cy="296.0" r="8" fill="#1f2933" stroke="none" stroke-width="1.6" />
<rect x="34.0" y="78.0" width="304.0" height="96.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<line x1="48.0" y1="98.0" x2="76.0" y2="98.0" stroke="#d64545" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="84.0" y="102.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2933" >Hard limits: where the arm physically stops.</text>
<text x="84.0" y="116.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >Set on ArmConfig. Used by the simulation.</text>
<line x1="48.0" y1="138.0" x2="76.0" y2="138.0" stroke="#c2630b" stroke-width="5" stroke-linecap="round"/>
<text x="84.0" y="142.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2933" >Soft limits: as far as the closed loop will go.</text>
<text x="84.0" y="156.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >Set on SmartMotorControllerConfig.</text>
<text x="34.0" y="436.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" >Keep the soft limits inside the hard limits, and every setpoint inside the soft limits.</text>
</svg>
