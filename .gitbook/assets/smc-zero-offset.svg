<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withExternalEncoderZeroOffset</title>
<desc id="d">Two dials. The encoder reads 37 degrees when the mechanism is at its zero. Subtracting a zero offset of 37 degrees makes YAMS report 0 degrees. To find it, move the mechanism to where you want zero, read the external encoder, and use that reading as the offset.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="300" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="268.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withExternalEncoderZeroOffset</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Moves an absolute encoder's zero to the mechanism's zero.</text>
<circle cx="130.0" cy="150.0" r="40" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.6" />
<line x1="130.0" y1="110.0" x2="130.0" y2="119.0" stroke="#52606d" stroke-width="1.6" stroke-linecap="round"/>
<text x="130.0" y="104.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >0</text>
<line x1="130.0" y1="150.0" x2="149.3" y2="124.4" stroke="#c2630b" stroke-width="3" stroke-linecap="round"/>
<circle cx="130.0" cy="150.0" r="4" fill="#1f2933" stroke="none" stroke-width="1.6" />
<text x="130.0" y="210.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c2630b" >what the encoder reads</text>
<text x="130.0" y="228.0" font-size="11" font-weight="700" text-anchor="middle" fill="#c2630b" font-family="Consolas, Menlo, monospace">37 deg</text>
<circle cx="380.0" cy="150.0" r="40" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.6" />
<line x1="380.0" y1="110.0" x2="380.0" y2="119.0" stroke="#52606d" stroke-width="1.6" stroke-linecap="round"/>
<text x="380.0" y="104.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >0</text>
<line x1="380.0" y1="150.0" x2="380.0" y2="118.0" stroke="#147d6f" stroke-width="3" stroke-linecap="round"/>
<circle cx="380.0" cy="150.0" r="4" fill="#1f2933" stroke="none" stroke-width="1.6" />
<text x="380.0" y="210.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#147d6f" >what YAMS reports</text>
<text x="380.0" y="228.0" font-size="11" font-weight="700" text-anchor="middle" fill="#147d6f" font-family="Consolas, Menlo, monospace">0 deg</text>
<line x1="196.0" y1="150.0" x2="312.0" y2="150.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="254.0" y="138.0" font-size="10" font-weight="700" text-anchor="middle" fill="#52606d" >minus the zero offset</text>
<text x="254.0" y="168.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#6b46c1" font-family="Consolas, Menlo, monospace">37 deg</text>
<rect x="470.0" y="104.0" width="256.0" height="124.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<text x="484.0" y="126.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Finding it</text>
<text x="484.0" y="148.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >1. Move the mechanism to where</text>
<text x="484.0" y="163.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >    you want zero to be.</text>
<text x="484.0" y="183.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >2. Read the external encoder.</text>
<text x="484.0" y="203.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >3. That reading is the offset.</text>
<text x="484.0" y="220.0" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">withExternalEncoderZeroOffset</text>
<text x="34.0" y="276.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >An absolute encoder's zero is wherever it was bolted on. The offset moves zero to where your mechanism's zero is.</text>
</svg>
