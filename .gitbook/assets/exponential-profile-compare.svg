<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Trapezoidal and exponential profiles</title>
<desc id="d">Two graphs. The first shows setpoint velocity over time: a trapezoidal profile ramps in a straight line to a flat top, an exponential profile rises quickly at first and then curves over as it nears top speed. The second shows acceleration against speed: the motor's available acceleration falls in a straight line to zero at top speed, the exponential profile follows that line, and the trapezoidal profile asks for a constant acceleration that the motor cannot give at high speed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
<rect width="760" height="328" fill="#f5f7fa"/>
