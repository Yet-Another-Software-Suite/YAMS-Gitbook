<text x="714.0" y="134.0" font-size="11" font-weight="700" text-anchor="end" fill="#3e6da8" >what the motor can give</text>
<text x="714.0" y="148.0" font-size="10" font-weight="400" text-anchor="end" fill="#52606d" >(and what exponential asks for)</text>
<text x="420.0" y="216.0" font-size="11" font-weight="700" text-anchor="start" fill="#c2630b" >trapezoidal asks for this</text>
<text x="420.0" y="246.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#d64545" >shaded: the motor cannot keep up</text>
<text x="400.0" y="90.0" font-size="12" font-weight="700" text-anchor="start" fill="#1f2933" >The acceleration it needs to follow it</text>
<text x="34.0" y="302.0" font-size="12" font-weight="700" text-anchor="start" fill="#1f2933" >A motor has less torque the faster it spins. An exponential profile plans for that; a trapezoidal one does not.</text>
</svg>
