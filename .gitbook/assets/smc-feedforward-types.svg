<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withFeedforward</title>
<desc id="d">Three feedforward types. SimpleMotorFeedforward, for flywheels, rollers and turrets, has kS, kV and kA and nothing to hold up. ArmFeedforward, for arms and pivots, adds kG times the cosine of the angle. ElevatorFeedforward, for elevators, adds a constant kG.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="324" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="292.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withFeedforward</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Three kinds, which differ only in how they hold the mechanism up against gravity.</text>
<rect x="34.0" y="84.0" width="220.0" height="190.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<text x="46.0" y="106.0" font-size="10.8" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">SimpleMotorFeedforward</text>
<text x="46.0" y="124.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >flywheels, rollers, turrets</text>
<circle cx="104.0" cy="196.0" r="30" fill="#d5f0ea" stroke="#147d6f" stroke-width="2.2" />
<circle cx="104.0" cy="196.0" r="4" fill="#1f2933" stroke="none" stroke-width="1.6" />
<path d="M141.6,182.3 A40,40 0 0 0 69.4,176.0" fill="none" stroke="#c2630b" stroke-width="2.2" marker-end="url(#ao)"/>
<text x="184.0" y="160.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kS</text>
<text x="184.0" y="177.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kV</text>
<text x="184.0" y="194.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kA</text>
<text x="144.0" y="262.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#52606d" >nothing to hold up</text>
<rect x="270.0" y="84.0" width="220.0" height="190.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<text x="282.0" y="106.0" font-size="10.8" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">ArmFeedforward</text>
<text x="282.0" y="124.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >arms and pivots</text>
<line x1="316.0" y1="220.0" x2="380.0" y2="184.0" stroke="#3e6da8" stroke-width="8" stroke-linecap="round"/>
<circle cx="316.0" cy="220.0" r="6" fill="#1f2933" stroke="none" stroke-width="1.6" />
<line x1="380.0" y1="184.0" x2="380.0" y2="222.0" stroke="#d64545" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="386.0" y="218.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#d64545" >gravity</text>
<text x="420.0" y="160.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kS</text>
<text x="420.0" y="177.0" font-size="11" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">kG</text>
<text x="420.0" y="194.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kV</text>
<text x="420.0" y="211.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kA</text>
<text x="380.0" y="262.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c2630b" >kG x cos(angle)</text>
<rect x="506.0" y="84.0" width="220.0" height="190.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<text x="518.0" y="106.0" font-size="10.8" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">ElevatorFeedforward</text>
<text x="518.0" y="124.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >elevators</text>
<rect x="546.0" y="154.0" width="12.0" height="84.0" rx="2" fill="#eef1f4" stroke="#52606d" stroke-width="1.2" />
<rect x="562.0" y="182.0" width="44.0" height="26.0" rx="3" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<line x1="584.0" y1="210.0" x2="584.0" y2="242.0" stroke="#d64545" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="590.0" y="240.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#d64545" >gravity</text>
<text x="656.0" y="160.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kS</text>
<text x="656.0" y="177.0" font-size="11" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">kG</text>
<text x="656.0" y="194.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kV</text>
<text x="656.0" y="211.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kA</text>
<text x="616.0" y="262.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c2630b" >kG, always the same</text>
<text x="34.0" y="300.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Pick the one that matches how gravity acts on the mechanism. The mechanism classes expect the matching type.</text>
</svg>
