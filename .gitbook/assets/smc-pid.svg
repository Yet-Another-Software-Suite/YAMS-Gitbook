<rect x="490.0" y="84.0" width="236.0" height="180.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<text x="504.0" y="108.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >The three gains</text>
<text x="504.0" y="132.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">kP</text>
<text x="532.0" y="132.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >push harder the further away</text>
<text x="504.0" y="154.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">kI</text>
<text x="532.0" y="154.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >push harder the longer it is off</text>
<text x="504.0" y="176.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">kD</text>
<text x="532.0" y="176.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >ease off as it gets close</text>
<text x="504.0" y="204.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >Input: rotations, or meters for</text>
<text x="504.0" y="219.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >a distance mechanism</text>
<text x="504.0" y="240.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >Output: volts</text>
<text x="64.0" y="0.0" font-size="1" font-weight="400" text-anchor="start" fill="#1f2933" ></text>
<line x1="52.0" y1="0.0" x2="52.0" y2="0.0" stroke="#52606d" stroke-width="0" stroke-linecap="round"/>
<line x1="52.0" y1="0.0" x2="52.0" y2="0.0" stroke="#d64545" stroke-width="0" stroke-linecap="round"/>
<line x1="52.0" y1="0.0" x2="52.0" y2="0.0" stroke="#147d6f" stroke-width="0" stroke-linecap="round"/>
<text x="250.0" y="196.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#52606d" >kP too low: slow</text>
<text x="250.0" y="212.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#d64545" >kP too high: overshoots</text>
<text x="250.0" y="228.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#147d6f" >kP with kD: quick and settled</text>
<text x="34.0" y="290.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >The same gains work on every vendor: YAMS converts them to the units each controller wants.</text>
</svg>
