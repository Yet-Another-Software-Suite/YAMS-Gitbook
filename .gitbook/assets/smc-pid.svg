<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withClosedLoopController</title>
<desc id="d">A graph of position against time moving to a setpoint with three sets of gains: a low kP that is slow, a high kP that overshoots, and kP with kD that is quick and settled. kP pushes harder the further away, kI pushes harder the longer it is off, kD eases off as it gets close. The input is rotations, or meters for a distance mechanism, and the output is volts.</desc>
