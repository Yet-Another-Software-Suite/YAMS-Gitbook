<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withUseExternalFeedbackEncoder</title>
<desc id="d">Two panels. With the option on, the default, the PID follows the external encoder. With it off, the PID follows the built in encoder and the external encoder only sets the built in encoder's starting position.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="304" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="272.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withUseExternalFeedbackEncoder</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Which encoder the closed loop controller listens to.</text>
<rect x="34.0" y="84.0" width="338.0" height="170.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >withUseExternalFeedbackEncoder(true)  (the default)</text>
<rect x="388.0" y="84.0" width="338.0" height="170.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="400.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" >withUseExternalFeedbackEncoder(false)</text>
<rect x="50.0" y="118.0" width="130.0" height="40.0" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6" />
<text x="115.0" y="142.5" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2933" >external encoder</text>
<rect x="50.0" y="176.0" width="130.0" height="40.0" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.6" />
<text x="115.0" y="200.5" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2933" >built in encoder</text>
<rect x="248.0" y="146.0" width="108.0" height="44.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<text x="302.0" y="173.2" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >PID</text>
<line x1="184.0" y1="138.0" x2="244.0" y2="162.0" stroke="#6b46c1" stroke-width="2" stroke-linecap="round" marker-end="url(#ap)"/>
<text x="203.0" y="240.0" font-size="10" font-weight="700" text-anchor="middle" fill="#147d6f" >the PID follows the external encoder</text>
<rect x="404.0" y="118.0" width="130.0" height="40.0" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.6" />
<text x="469.0" y="142.5" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2933" >external encoder</text>
<rect x="404.0" y="176.0" width="130.0" height="40.0" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6" />
<text x="469.0" y="200.5" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2933" >built in encoder</text>
<rect x="602.0" y="146.0" width="108.0" height="44.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<text x="656.0" y="173.2" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >PID</text>
<line x1="538.0" y1="196.0" x2="598.0" y2="174.0" stroke="#6b46c1" stroke-width="2" stroke-linecap="round" marker-end="url(#ap)"/>
<text x="557.0" y="240.0" font-size="10" font-weight="700" text-anchor="middle" fill="#c2630b" >the external encoder only sets the start</text>
<line x1="469.0" y1="160.0" x2="469.0" y2="174.0" stroke="#52606d" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#ak)"/>
<text x="478.0" y="171.0" font-size="9" font-weight="400" text-anchor="start" fill="#52606d" >seeds it</text>
<text x="34.0" y="280.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Turn it off when the external encoder is too slow or noisy to close the loop on, but still knows where zero is.</text>
</svg>
