<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What the motor's voltage is made of</title>
<desc id="d">A bar of the output voltage split into parts: kS to overcome friction, kG to hold against gravity, kV times velocity to keep moving, kA times acceleration to speed up, and a small PID part that fixes whatever is left. All but the PID part are feedforward, known before the mechanism moves.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="256" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="224.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >What the motor's voltage is made of</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >An example moment partway through an arm move. The numbers are illustrative.</text>
<rect x="34.0" y="100.0" width="65.2" height="46.0" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.6" />
<text x="66.6" y="120.0" font-size="10.8" font-weight="700" text-anchor="middle" fill="#1f2933" >kS</text>
<text x="66.6" y="137.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >0.9 V</text>
<text x="66.6" y="164.0" font-size="9.6" font-weight="400" text-anchor="middle" fill="#52606d" >overcome friction</text>
<rect x="103.2" y="100.0" width="119.0" height="46.0" rx="8" fill="#fde2e2" stroke="#d64545" stroke-width="1.6" />
<text x="162.7" y="120.0" font-size="10.8" font-weight="700" text-anchor="middle" fill="#1f2933" >kG</text>
<text x="162.7" y="137.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >1.6 V</text>
<text x="162.7" y="164.0" font-size="9.6" font-weight="400" text-anchor="middle" fill="#52606d" >hold against gravity</text>
<rect x="226.2" y="100.0" width="318.9" height="46.0" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<text x="385.7" y="120.0" font-size="10.8" font-weight="700" text-anchor="middle" fill="#1f2933" >kV x velocity</text>
<text x="385.7" y="137.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >4.2 V</text>
<text x="385.7" y="164.0" font-size="9.6" font-weight="400" text-anchor="middle" fill="#52606d" >keep moving at this speed</text>
<rect x="549.2" y="100.0" width="111.3" height="46.0" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6" />
<text x="604.8" y="120.0" font-size="10.8" font-weight="700" text-anchor="middle" fill="#1f2933" >kA x acceleration</text>
<text x="604.8" y="137.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >1.5 V</text>
<text x="604.8" y="164.0" font-size="9.6" font-weight="400" text-anchor="middle" fill="#52606d" >speed up</text>
<rect x="664.5" y="100.0" width="57.5" height="46.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<text x="693.2" y="120.0" font-size="10.8" font-weight="700" text-anchor="middle" fill="#1f2933" >PID</text>
<text x="693.2" y="137.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >0.8 V</text>
<text x="693.2" y="164.0" font-size="9.6" font-weight="400" text-anchor="middle" fill="#52606d" >fix the rest</text>
<line x1="34.0" y1="184.0" x2="658.5" y2="184.0" stroke="#147d6f" stroke-width="2" stroke-linecap="round"/>
<text x="349.2" y="202.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#147d6f" >feedforward: known before the mechanism moves</text>
<line x1="664.5" y1="184.0" x2="722.0" y2="184.0" stroke="#c2630b" stroke-width="2" stroke-linecap="round"/>
<text x="722.0" y="202.0" font-size="10.5" font-weight="700" text-anchor="end" fill="#c2630b" >feedback</text>
<text x="34.0" y="232.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >A good feedforward does most of the work, so the PID gains can stay small and the mechanism stays calm.</text>
</svg>
