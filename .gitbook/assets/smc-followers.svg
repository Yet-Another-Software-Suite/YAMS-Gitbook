<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withFollowers and withLooselyCoupledFollowers</title>
<desc id="d">Two panels. With withFollowers, a leader and a follower are on one shaft and the follower copies the leader's output; it must be the same vendor, and a boolean says whether it is inverted relative to the leader. With withLooselyCoupledFollowers, two separate motors each lift one end of a cross bar; each gets the same setpoint and closes its own loop on its own encoder.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="310" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="278.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withFollowers and withLooselyCoupledFollowers</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Two ways for more than one motor to move one mechanism.</text>
<rect x="34.0" y="84.0" width="338.0" height="176.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#3e6da8" >withFollowers</text>
<rect x="388.0" y="84.0" width="338.0" height="176.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="400.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#6b46c1" >withLooselyCoupledFollowers</text>
<rect x="60.0" y="152.0" width="286.0" height="12.0" rx="3" fill="#eef1f4" stroke="#52606d" stroke-width="1.2" />
<text x="203.0" y="182.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >one shaft</text>
<rect x="70.0" y="118.0" width="96.0" height="34.0" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<text x="118.0" y="139.8" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >leader</text>
<rect x="240.0" y="118.0" width="96.0" height="34.0" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="288.0" y="139.8" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933" >follower</text>
<line x1="170.0" y1="135.0" x2="236.0" y2="135.0" stroke="#3e6da8" stroke-width="2" stroke-linecap="round" marker-end="url(#ab)"/>
<text x="203.0" y="127.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >same output</text>
<text x="48.0" y="206.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >The follower copies the leader's output.</text>
<text x="48.0" y="224.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >Same vendor as the leader. The boolean says</text>
<text x="48.0" y="239.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >whether it is inverted relative to the leader.</text>
<rect x="432.0" y="160.0" width="16.0" height="50.0" rx="3" fill="#eef1f4" stroke="#52606d" stroke-width="1.2" />
<rect x="435.0" y="136.0" width="10.0" height="36.0" rx="2" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.4" />
<rect x="402.0" y="214.0" width="76.0" height="26.0" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<text x="440.0" y="231.2" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2933" >motor 1</text>
<rect x="582.0" y="160.0" width="16.0" height="50.0" rx="3" fill="#eef1f4" stroke="#52606d" stroke-width="1.2" />
<rect x="585.0" y="136.0" width="10.0" height="36.0" rx="2" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.4" />
<rect x="552.0" y="214.0" width="76.0" height="26.0" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6" />
<text x="590.0" y="231.2" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2933" >motor 2</text>
<rect x="430.0" y="128.0" width="172.0" height="9.0" rx="3" fill="#fde3c8" stroke="#c2630b" stroke-width="1.4" />
<text x="516.0" y="122.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >cross bar</text>
<line x1="482.0" y1="227.0" x2="548.0" y2="227.0" stroke="#6b46c1" stroke-width="2" stroke-linecap="round" marker-end="url(#ap)"/>
<text x="515.0" y="250.0" font-size="9.5" font-weight="700" text-anchor="middle" fill="#6b46c1" >same setpoint, own PID</text>
<text x="630.0" y="150.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >Each motor closes</text>
<text x="630.0" y="165.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >its own loop on its</text>
<text x="630.0" y="180.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >own encoder.</text>
<text x="34.0" y="286.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Followers share a shaft. Loosely coupled followers are separate motors that must arrive at the same place.</text>
</svg>
