<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withSimColor and withMechanismPositionConfig</title>
<desc id="d">A Mechanism2d window showing a robot outline, the mechanism as an orange line and its setpoint as a grey line. withSimColor sets the color of the mechanism's line. withMechanismPositionConfig sets where it sits on the robot with withRelativePosition, the size of the window with withMaxRobotLength and withMaxRobotHeight, and the plane it moves in with withMovementPlane. None of these change how the mechanism moves.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="336" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="304.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withSimColor and withMechanismPositionConfig</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >How the mechanism is drawn on a dashboard.</text>
<rect x="34.0" y="90.0" width="330.0" height="196.0" rx="6" fill="#10151c" stroke="#10151c" stroke-width="1" />
<text x="44.0" y="106.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#9aa5b1" >Mechanism2d</text>
<rect x="74.0" y="240.0" width="190.0" height="18.0" rx="2" fill="none" stroke="#52606d" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="169.0" y="274.0" font-size="9" font-weight="400" text-anchor="middle" fill="#9aa5b1" >robot outline</text>
<line x1="154.0" y1="240.0" x2="173.1" y2="131.7" stroke="#6b7c93" stroke-width="5" stroke-linecap="round"/>
<line x1="154.0" y1="240.0" x2="224.7" y2="155.7" stroke="#f6a03c" stroke-width="7" stroke-linecap="round"/>
<circle cx="154.0" cy="240.0" r="5" fill="#ffffff" stroke="none" stroke-width="1.6" />
<text x="232.7" y="159.7" font-size="10" font-weight="700" text-anchor="start" fill="#f6a03c" >the mechanism</text>
<text x="169.1" y="125.7" font-size="10" font-weight="400" text-anchor="middle" fill="#9aa5b1" >its setpoint</text>
<rect x="384.0" y="90.0" width="342.0" height="196.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<text x="398.0" y="112.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >What changes the picture</text>
<text x="398.0" y="136.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">withSimColor</text>
<text x="398.0" y="152.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >the color of the mechanism's line</text>
<text x="398.0" y="178.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">withMechanismPositionConfig</text>
<text x="410.0" y="196.0" font-size="10" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">.withRelativePosition</text>
<text x="566.0" y="196.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >where it sits on the robot</text>
<text x="410.0" y="214.0" font-size="10" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">.withMaxRobotLength / Height</text>
<text x="410.0" y="230.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >the size of the window</text>
<text x="410.0" y="250.0" font-size="10" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">.withMovementPlane</text>
<text x="548.0" y="250.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >XZ (side), YZ or XY</text>
<text x="398.0" y="274.0" font-size="10" font-weight="700" text-anchor="start" fill="#1f2933" >None of these change how the mechanism moves.</text>
<text x="34.0" y="312.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Each mechanism publishes this window in simulation, so you can watch it without a robot.</text>
</svg>
