<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withTrapezoidalProfile</title>
<desc id="d">Two graphs. Position: the goal is a flat line and the setpoint the PID follows rises to it in a smooth S shape. Velocity: the setpoint's velocity ramps up at the maximum acceleration, holds at the maximum velocity, and ramps back down, making a trapezoid.</desc>
