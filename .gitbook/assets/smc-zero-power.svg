<text x="326.9" y="221.6" font-size="11" font-weight="700" text-anchor="start" fill="#c2630b" >BRAKE: stops quickly, then resists being moved</text>
<text x="459.7" y="181.9" font-size="11" font-weight="700" text-anchor="start" fill="#3e6da8" >COAST: keeps moving, free to be moved</text>
<text x="34.0" y="280.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Either mode is your choice. BRAKE resists movement but does not hold an arm or elevator up. COAST suits flywheels.</text>
