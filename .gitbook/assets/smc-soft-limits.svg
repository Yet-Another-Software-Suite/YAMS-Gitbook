<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" width="760" height="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withSoftLimits</title>
<desc id="d">A bar showing a mechanism's travel between two hard stops, with a lower and an upper soft limit a little inside them. The mechanism may move between the soft limits. A setpoint asked for beyond the upper limit is moved back to the limit.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="282" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="250.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withSoftLimits</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The range the motor controller is allowed to drive the mechanism through.</text>
<rect x="70.0" y="138.0" width="620.0" height="24.0" rx="12" fill="#eef1f4" stroke="#cbd2d9" stroke-width="1.2" />
<rect x="190.0" y="138.0" width="400.0" height="24.0" rx="4" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<rect x="70.0" y="138.0" width="120.0" height="24.0" rx="12" fill="#fde2e2" stroke="none" stroke-width="0" />
<rect x="590.0" y="138.0" width="100.0" height="24.0" rx="12" fill="#fde2e2" stroke="none" stroke-width="0" />
<line x1="190.0" y1="124.0" x2="190.0" y2="176.0" stroke="#d64545" stroke-width="2.4" stroke-linecap="round"/>
<line x1="590.0" y1="124.0" x2="590.0" y2="176.0" stroke="#d64545" stroke-width="2.4" stroke-linecap="round"/>
<text x="190.0" y="116.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#d64545" >lower limit</text>
<text x="590.0" y="116.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#d64545" >upper limit</text>
<text x="390.0" y="154.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#147d6f" >the mechanism may move here</text>
<line x1="70.0" y1="128.0" x2="70.0" y2="172.0" stroke="#1f2933" stroke-width="3" stroke-linecap="round"/>
<line x1="690.0" y1="128.0" x2="690.0" y2="172.0" stroke="#1f2933" stroke-width="3" stroke-linecap="round"/>
<text x="70.0" y="190.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >hard stop</text>
<text x="690.0" y="190.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >hard stop</text>
<circle cx="650.0" cy="150.0" r="7" fill="#ffffff" stroke="#3e6da8" stroke-width="2.2" />
<text x="650.0" y="96.0" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6da8" >setpoint asked for</text>
<line x1="650.0" y1="102.0" x2="650.0" y2="140.0" stroke="#3e6da8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="642.0" y1="172.0" x2="596.0" y2="172.0" stroke="#c2630b" stroke-width="2" stroke-linecap="round" marker-end="url(#ao)"/>
<text x="622.0" y="202.0" font-size="10" font-weight="700" text-anchor="middle" fill="#c2630b" >moved back to the limit</text>
<text x="34.0" y="232.0" font-size="10" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">withSoftLimits(Degrees.of(-20), Degrees.of(100))     withSoftLimits(Meters.of(0), Meters.of(1.2))</text>
<text x="34.0" y="258.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Put the soft limits a little inside the hard stops, so the mechanism stops under control before it hits metal.</text>
</svg>
