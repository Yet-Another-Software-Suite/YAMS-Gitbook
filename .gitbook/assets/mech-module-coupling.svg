<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">SwerveModuleConfig: withCouplingRatio</title>
<desc id="d">Inside a swerve module, turning the azimuth also turns the wheel through the drive gearing, even with the drive motor stopped. withCouplingRatio takes how many drive motor rotations one azimuth rotation causes. With it set, YAMS adds that motion to the drive setpoint and removes it from the measured wheel speed and distance.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="320" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="288.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >SwerveModuleConfig: withCouplingRatio</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >On most modules, steering the wheel also rolls it a little.</text>
<rect x="34.0" y="84.0" width="338.0" height="186.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" >What happens inside the module</text>
<path d="M147.0,176.0 L146.8,179.6 L141.4,182.2 L140.6,185.3 L144.2,190.2 L142.6,193.4 L136.6,193.8 L134.7,196.3 L136.2,202.2 L133.5,204.6 L127.8,202.6 L125.1,204.2 L124.2,210.2 L120.7,211.4 L116.2,207.4 L113.1,207.8 L110.0,213.0 L106.4,212.8 L103.8,207.4 L100.7,206.6 L95.8,210.2 L92.6,208.6 L92.2,202.6 L89.7,200.7 L83.8,202.2 L81.4,199.5 L83.4,193.8 L81.8,191.1 L75.8,190.2 L74.6,186.7 L78.6,182.2 L78.2,179.1 L73.0,176.0 L73.2,172.4 L78.6,169.8 L79.4,166.7 L75.8,161.8 L77.4,158.6 L83.4,158.2 L85.3,155.7 L83.8,149.8 L86.5,147.4 L92.2,149.4 L94.9,147.8 L95.8,141.8 L99.3,140.6 L103.8,144.6 L106.9,144.2 L110.0,139.0 L113.6,139.2 L116.2,144.6 L119.3,145.4 L124.2,141.8 L127.4,143.4 L127.8,149.4 L130.3,151.3 L136.2,149.8 L138.6,152.5 L136.6,158.2 L138.2,160.9 L144.2,161.8 L145.4,165.3 L141.4,169.8 L141.8,172.9 L147.0,176.0" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="110.0" cy="176.0" r="4" fill="#147d6f" stroke="none" stroke-width="1.6" />
<text x="110.0" y="232.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#147d6f" >azimuth turns</text>
<path d="M149.8,153.0 A46,46 0 0 0 70.2,153.0" fill="none" stroke="#147d6f" stroke-width="2.2" marker-end="url(#ag)"/>
<path d="M261.0,176.0 L260.7,179.9 L255.0,182.2 L253.8,185.1 L256.2,190.7 L253.7,193.7 L247.8,192.2 L245.1,193.8 L243.7,199.8 L239.9,200.7 L236.0,196.0 L232.9,195.8 L228.3,199.8 L224.7,198.3 L224.2,192.2 L221.9,190.1 L215.8,190.7 L213.7,187.3 L217.0,182.2 L216.2,179.1 L211.0,176.0 L211.3,172.1 L217.0,169.8 L218.2,166.9 L215.8,161.3 L218.3,158.3 L224.2,159.8 L226.9,158.2 L228.3,152.2 L232.1,151.3 L236.0,156.0 L239.1,156.2 L243.7,152.2 L247.3,153.7 L247.8,159.8 L250.1,161.9 L256.2,161.3 L258.3,164.7 L255.0,169.8 L255.8,172.9 L261.0,176.0" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="236.0" cy="176.0" r="4" fill="#3e6da8" stroke="none" stroke-width="1.6" />
<text x="236.0" y="232.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#3e6da8" >the wheel turns too</text>
<path d="M206.6,159.0 A34,34 0 0 1 265.4,159.0" fill="none" stroke="#3e6da8" stroke-width="2.2" marker-end="url(#ab)"/>
<line x1="150.0" y1="176.0" x2="208.0" y2="176.0" stroke="#52606d" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="203.0" y="258.0" font-size="10" font-weight="700" text-anchor="middle" fill="#d64545" >even with the drive motor stopped</text>
<rect x="388.0" y="84.0" width="338.0" height="186.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<text x="402.0" y="106.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >withCouplingRatio(3.5)</text>
<text x="402.0" y="130.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >The ratio is how many drive motor rotations</text>
<text x="402.0" y="146.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >one azimuth rotation causes.</text>
<text x="402.0" y="174.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >With it set, YAMS</text>
<text x="402.0" y="194.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >- adds that motion to the drive setpoint</text>
<text x="402.0" y="212.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >- removes it from the measured wheel</text>
<text x="402.0" y="228.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >   speed and distance</text>
<text x="402.0" y="256.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >It is kCoupleRatio in CTRE Tuner X.</text>
<text x="34.0" y="296.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Without it, steering shows up as driving in the odometry, and the robot's position slowly drifts.</text>
</svg>
