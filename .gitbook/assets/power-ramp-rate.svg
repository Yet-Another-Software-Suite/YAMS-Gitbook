<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Illustrative shapes for a mechanism starting from rest.</text>
<text x="40.0" y="88.0" font-size="12" font-weight="700" text-anchor="start" fill="#1f2933" >No ramp rate</text>
