<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 378" width="760" height="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What a ramp rate does</title>
<desc id="d">Two pairs of graphs. Without a ramp rate the motor output jumps to full at once and the current spikes high before decaying. With a 0.25 second ramp rate the output climbs over 0.25 seconds and the current is a lower, wider bump, at the cost of a slower start.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
