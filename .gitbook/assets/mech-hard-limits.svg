<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withHardLimits</title>
<desc id="d">A bar of a mechanism's travel. The hard limits at each end are physical stops. The soft limits sit a little inside them and are where the motor controller keeps the mechanism. withHardLimits is set on the mechanism config and the simulated mechanism cannot pass them. withSoftLimits is set on the motor config and the real motor controller will not drive past them.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="324" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="292.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withHardLimits</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Where the mechanism physically cannot go any further.</text>
<rect x="70.0" y="148.0" width="620.0" height="24.0" rx="12" fill="#eef1f4" stroke="#cbd2d9" stroke-width="1.2" />
<rect x="150.0" y="148.0" width="460.0" height="24.0" rx="4" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<line x1="70.0" y1="130.0" x2="70.0" y2="190.0" stroke="#1f2933" stroke-width="5" stroke-linecap="round"/>
<line x1="690.0" y1="130.0" x2="690.0" y2="190.0" stroke="#1f2933" stroke-width="5" stroke-linecap="round"/>
<text x="70.0" y="120.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2933" >hard limit</text>
<text x="690.0" y="120.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2933" >hard limit</text>
<text x="70.0" y="206.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >a physical stop</text>
<text x="690.0" y="206.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >a physical stop</text>
<line x1="150.0" y1="138.0" x2="150.0" y2="182.0" stroke="#d64545" stroke-width="2.2" stroke-linecap="round"/>
<line x1="610.0" y1="138.0" x2="610.0" y2="182.0" stroke="#d64545" stroke-width="2.2" stroke-linecap="round"/>
<text x="150.0" y="130.0" font-size="10" font-weight="700" text-anchor="middle" fill="#d64545" >soft limit</text>
<text x="610.0" y="130.0" font-size="10" font-weight="700" text-anchor="middle" fill="#d64545" >soft limit</text>
<text x="380.0" y="164.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#147d6f" >where the motor controller keeps the mechanism</text>
<rect x="34.0" y="226.0" width="338.0" height="48.0" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.4" />
<text x="203.0" y="246.0" font-size="10.8" font-weight="700" text-anchor="middle" fill="#1f2933" >withHardLimits: on the mechanism config</text>
<text x="203.0" y="263.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >the simulated mechanism cannot pass them</text>
<rect x="388.0" y="226.0" width="338.0" height="48.0" rx="8" fill="#fde2e2" stroke="#d64545" stroke-width="1.4" />
<text x="557.0" y="246.0" font-size="10.8" font-weight="700" text-anchor="middle" fill="#1f2933" >withSoftLimits: on the motor config</text>
<text x="557.0" y="263.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >the real motor controller will not drive past them</text>
<text x="34.0" y="300.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Hard limits are where the metal is. Soft limits go a little inside them. Set both.</text>
</svg>
