<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Driving a motor at a voltage</title>
<desc id="d">Three steps. Closed loop: the leader and its loosely coupled follower hold the setpoint. Voltage on: the closed loops stop and the leader and its follower are both driven at voltage/setpoint every loop. Voltage off, or the Live Tuning command ends: the voltage goes to 0, the closed loops start again and the setpoint is sent again. When the command ends, voltage/enabled is set back to false.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
<rect width="760" height="300" fill="#f5f7fa"/>
<rect x="16" y="16" width="728" height="268" rx="10" fill="#ffffff" stroke="#cbd2d9"/>
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >Driving a motor at a voltage</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The closed loop hands over to the voltage, and back again. The loosely coupled followers go with the leader.</text>
<text x="138.0" y="94.0" font-size="11" font-weight="700" text-anchor="middle" fill="#3e6da8" font-family="Consolas, Menlo, monospace">voltage/enabled = false</text>
<rect x="40" y="104" width="196" height="96" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6"/>
<text x="138.0" y="132.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933" >Closed loop</text>
<text x="138.0" y="150.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >the leader holds the setpoint</text>
<text x="138.0" y="166.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >the follower is sent it too</text>
<text x="138.0" y="182.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >and runs its own closed loop</text>
<text x="380.0" y="94.0" font-size="11" font-weight="700" text-anchor="middle" fill="#c2630b" font-family="Consolas, Menlo, monospace">voltage/enabled = true</text>
<rect x="282" y="104" width="196" height="96" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6"/>
<text x="380.0" y="132.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933" >Voltage</text>
<text x="380.0" y="150.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >both closed loops stop</text>
<text x="380.0" y="166.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >the leader and the follower are</text>
<text x="380.0" y="182.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >driven at voltage/setpoint</text>
<text x="622.0" y="94.0" font-size="11" font-weight="700" text-anchor="middle" fill="#6b46c1" font-family="Consolas, Menlo, monospace">false, or Live Tuning ends</text>
<rect x="524" y="104" width="196" height="96" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6"/>
<text x="622.0" y="132.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933" >Back to the closed loop</text>
<text x="622.0" y="150.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >the voltage goes to 0</text>
<text x="622.0" y="166.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >both closed loops start again</text>
<text x="622.0" y="182.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >and the setpoint is sent again</text>
<line x1="240" y1="152.0" x2="278" y2="152.0" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="482" y1="152.0" x2="520" y2="152.0" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M622.0,204 V236 H138.0 V206" fill="none" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="230.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#6b46c1" >holding the setpoint again</text>
<text x="380.0" y="262.0" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >When the Live Tuning command ends, voltage/enabled is set back to false, so the voltage is not applied again when it restarts.</text>
</svg>
