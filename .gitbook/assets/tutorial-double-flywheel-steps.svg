<text x="98.0" y="123.0" font-size="11" font-weight="400" text-anchor="start" fill="#52606d" >One config and one SmartMotorController for each flywheel.</text>
<text x="710.0" y="114.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#52606d" font-family="Consolas, Menlo, monospace">2 x (TalonFX + SmartMotorControllerConfig)</text>
