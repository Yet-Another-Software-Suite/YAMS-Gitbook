<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What you build in this tutorial</title>
<desc id="d">The three steps of the double flywheel tutorial. Step 1, two motor controllers: one config and one SmartMotorController for each flywheel. Step 2, commands and buttons: one command sets both speeds, with presets for no spin, backspin and topspin. Step 3, spin control and followers: a spin ratio between the wheels, and what to do when they share a shaft.</desc>
