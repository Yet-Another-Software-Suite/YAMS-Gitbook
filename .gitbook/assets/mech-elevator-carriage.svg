<title id="t">ElevatorConfig: withCarriageWeight</title>
<desc id="d">Two carriages, one of 8 pounds and one of 20 pounds, and a graph of simulated height. With the same gains the 8 pound carriage reaches the setpoint quickly, and the 20 pound carriage rises more slowly and sags below it.</desc>
