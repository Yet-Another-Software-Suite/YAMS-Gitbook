<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How live tuning works</title>
<desc id="d">A loop of three boxes. The dashboard sends tunable values over NetworkTables under NT Tuning to the Live Tuning command, which applies them to the SmartMotorController every loop. Telemetry under NT Mechanisms flows back to the dashboard so you can watch the response.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
<rect width="760" height="300" fill="#f5f7fa"/>
<rect x="16" y="16" width="728" height="268" rx="10" fill="#ffffff" stroke="#cbd2d9"/>
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >How live tuning works</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >You edit values on the dashboard, YAMS applies them, and telemetry shows you the result.</text>
<rect x="40" y="104" width="196" height="78" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6"/>
<text x="138.0" y="132.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933" >Dashboard</text>
<text x="138.0" y="148.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >Elastic or AdvantageScope</text>
<text x="138.0" y="164.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >you type kP = 6</text>
<rect x="282" y="104" width="196" height="78" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6"/>
<text x="380.0" y="132.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933" >Live Tuning command</text>
<text x="380.0" y="148.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >runs while the robot is enabled</text>
<text x="380.0" y="164.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >applies the values every loop</text>
<rect x="524" y="104" width="196" height="78" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6"/>
<text x="622.0" y="132.5" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933" >SmartMotorController</text>
<text x="622.0" y="148.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >your mechanism's motor</text>
<text x="622.0" y="164.5" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >uses the new gains at once</text>
<line x1="240" y1="143.0" x2="278" y2="143.0" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="482" y1="143.0" x2="520" y2="143.0" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="259.0" y="134.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c2630b" >tunable</text>
<text x="259.0" y="161.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c2630b" >values</text>
<text x="138.0" y="94.0" font-size="11" font-weight="700" text-anchor="middle" fill="#c2630b" font-family="Consolas, Menlo, monospace">NT:/Tuning/&lt;name&gt;/...</text>
<path d="M622.0,186 V226 H138.0 V188" fill="none" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="220.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3e6da8" >telemetry, read-only: what the mechanism actually did</text>
<text x="380.0" y="244.0" font-size="11" font-weight="700" text-anchor="middle" fill="#3e6da8" font-family="Consolas, Menlo, monospace">NT:/Mechanisms/&lt;name&gt;/...</text>
<text x="34.0" y="272.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#147d6f" >Change a number, watch the graph, change it again. No redeploy in between.</text>
</svg>
