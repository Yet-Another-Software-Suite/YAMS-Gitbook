<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withCascadingElevatorStages</title>
<desc id="d">Three elevators with one, two and three cascading stages. For the same motor movement the carriage travels one, two and three times as far, so the gearing is divided by the number of stages.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="324" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="292.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withCascadingElevatorStages</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >A cascading elevator's carriage moves further than the motor pulls.</text>
<rect x="34.0" y="84.0" width="220.0" height="190.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#52606d" >One stage</text>
<rect x="64.0" y="206.0" width="26.0" height="52.0" rx="3" fill="#eef1f4" stroke="#52606d" stroke-width="1.4" />
<rect x="78.0" y="180.0" width="26.0" height="52.0" rx="3" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.4" />
<rect x="88.0" y="176.0" width="34.0" height="12.0" rx="3" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<line x1="184.0" y1="206.0" x2="184.0" y2="182.0" stroke="#c2630b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ao)"/>
<text x="194.0" y="197.0" font-size="13" font-weight="700" text-anchor="start" fill="#c2630b" >1x</text>
<text x="144.0" y="268.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >carriage travel</text>
<rect x="270.0" y="84.0" width="220.0" height="190.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="282.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >withCascadingElevatorStages(2)</text>
<rect x="300.0" y="206.0" width="26.0" height="52.0" rx="3" fill="#eef1f4" stroke="#52606d" stroke-width="1.4" />
<rect x="314.0" y="180.0" width="26.0" height="52.0" rx="3" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.4" />
<rect x="328.0" y="154.0" width="26.0" height="52.0" rx="3" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.4" />
<rect x="338.0" y="150.0" width="34.0" height="12.0" rx="3" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<line x1="420.0" y1="206.0" x2="420.0" y2="156.0" stroke="#c2630b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ao)"/>
<text x="430.0" y="184.0" font-size="13" font-weight="700" text-anchor="start" fill="#c2630b" >2x</text>
<text x="380.0" y="268.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >carriage travel</text>
<rect x="506.0" y="84.0" width="220.0" height="190.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="518.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >withCascadingElevatorStages(3)</text>
<rect x="536.0" y="206.0" width="26.0" height="52.0" rx="3" fill="#eef1f4" stroke="#52606d" stroke-width="1.4" />
<rect x="550.0" y="180.0" width="26.0" height="52.0" rx="3" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.4" />
<rect x="564.0" y="154.0" width="26.0" height="52.0" rx="3" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.4" />
<rect x="578.0" y="128.0" width="26.0" height="52.0" rx="3" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.4" />
<rect x="588.0" y="124.0" width="34.0" height="12.0" rx="3" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<line x1="656.0" y1="206.0" x2="656.0" y2="130.0" stroke="#c2630b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ao)"/>
<text x="666.0" y="171.0" font-size="13" font-weight="700" text-anchor="start" fill="#c2630b" >3x</text>
<text x="616.0" y="268.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >carriage travel</text>
<text x="34.0" y="300.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Each stage adds the same travel again, so the gearing is divided by the number of stages.</text>
</svg>
