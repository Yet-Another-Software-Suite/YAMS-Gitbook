<text x="150.0" y="363.0" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6da8" >carriage</text>
<line x1="92.0" y1="372.0" x2="104.0" y2="372.0" stroke="#52606d" stroke-width="1.2" stroke-linecap="round"/>
<text x="86.0" y="376.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#52606d" >0 m</text>
