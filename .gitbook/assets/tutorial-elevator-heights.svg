<text x="230.0" y="330.0" font-size="11" font-weight="700" text-anchor="start" fill="#147d6f" >0.5 m  A button</text>
<rect x="430.0" y="84.0" width="296.0" height="96.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<line x1="444.0" y1="104.0" x2="472.0" y2="104.0" stroke="#d64545" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="480.0" y="108.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2933" >Hard limits: where the carriage physically stops.</text>
<text x="480.0" y="122.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >Set on ElevatorConfig. Used by the simulation.</text>
<line x1="444.0" y1="144.0" x2="472.0" y2="144.0" stroke="#c2630b" stroke-width="5" stroke-linecap="round"/>
<text x="480.0" y="148.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2933" >Soft limits: as far as the closed loop will go.</text>
<text x="480.0" y="162.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >Set on SmartMotorControllerConfig.</text>
