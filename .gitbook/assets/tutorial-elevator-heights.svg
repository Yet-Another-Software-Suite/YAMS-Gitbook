<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Heights are measured from the bottom of the carriage's travel.</text>
<rect x="142.0" y="96.0" width="16.0" height="276.0" rx="3" fill="#eef1f4" stroke="#52606d" stroke-width="1.4" />
<line x1="110.0" y1="372.0" x2="190.0" y2="372.0" stroke="#1f2933" stroke-width="3" stroke-linecap="round"/>
