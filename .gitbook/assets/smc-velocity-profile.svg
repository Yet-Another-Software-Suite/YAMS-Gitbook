<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">A velocity profile</title>
<desc id="d">A graph of velocity against time. The requested speed jumps up in a step. The setpoint rises to it in a smooth curve limited by a maximum acceleration and a maximum jerk, which is how quickly acceleration changes.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="332" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="300.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >A velocity profile</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The same idea for mechanisms that hold a speed instead of a position.</text>
<rect x="34.0" y="84.0" width="692.0" height="176.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<line x1="48.0" y1="240.0" x2="712.0" y2="240.0" stroke="#cbd2d9" stroke-width="1.2" stroke-linecap="round"/>
<line x1="48.0" y1="110.0" x2="48.0" y2="240.0" stroke="#cbd2d9" stroke-width="1.2" stroke-linecap="round"/>
<text x="46.0" y="101.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >velocity</text>
<text x="714.0" y="253.0" font-size="10" font-weight="400" text-anchor="end" fill="#52606d" >time</text>
<path d="M48.0,229.6 L127.7,229.6 L127.7,130.8 L712.0,130.8" fill="none" stroke="#3e6da8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="138.3" y="124.8" font-size="10" font-weight="700" text-anchor="start" fill="#3e6da8" >the speed you asked for</text>
