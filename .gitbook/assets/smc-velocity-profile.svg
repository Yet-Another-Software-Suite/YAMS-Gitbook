<text x="326.9" y="188.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" >the setpoint: limited by a maximum acceleration</text>
<text x="326.9" y="203.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >and a maximum jerk (how quickly acceleration changes)</text>
<text x="34.0" y="284.0" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">withTrapezoidalProfile(RotationsPerSecondPerSecond.of(200), RotationsPerSecondPerSecond.per(Second).of(2000))</text>
<text x="34.0" y="308.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >For flywheels: a smooth spin up that does not brown the robot out or slip the belt.</text>
</svg>
