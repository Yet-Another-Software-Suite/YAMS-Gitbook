<path d="M402.0,110.0 L712.0,110.0" fill="none" stroke="#52606d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="705.8" y="125.0" font-size="10" font-weight="400" text-anchor="end" fill="#52606d" >without: always full speed</text>
<text x="420.6" y="199.6" font-size="10.5" font-weight="700" text-anchor="start" fill="#147d6f" >with: speed x cos(error)</text>
<circle cx="539.8" cy="142.8" r="5" fill="#c2630b" stroke="none" stroke-width="1.6" />
<text x="547.8" y="136.8" font-size="10" font-weight="700" text-anchor="start" fill="#c2630b" >77% at 40 deg</text>
<text x="34.0" y="296.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Off by default. It makes direction changes smoother at the cost of a little speed while the wheels turn.</text>
</svg>
