<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">SwerveModuleConfig: withCosineCompensation</title>
<desc id="d">A wheel pointing 40 degrees away from where it should, where full speed would push the robot sideways. A graph of drive speed against angle error: without the option the speed is always full, with it the speed is multiplied by the cosine of the error, 77 percent at 40 degrees.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="320" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="288.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >SwerveModuleConfig: withCosineCompensation</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Slows a wheel's drive while it is still turning to its angle.</text>
<rect x="34.0" y="84.0" width="338.0" height="186.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" >A wheel still turning to its angle</text>
<g transform="translate(150.0,204.0) rotate(40.0)"><rect x="-11.0" y="-30.0" width="22.0" height="60.0" rx="4" fill="#1f2933" stroke="#1f2933" stroke-width="0" /><path d="M-4,-22.0 L0,-28.0 L4,-22.0 Z" fill="#ffffff"/></g>
<line x1="150.0" y1="204.0" x2="150.0" y2="128.0" stroke="#147d6f" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ag)"/>
<text x="140.0" y="154.0" font-size="10" font-weight="700" text-anchor="end" fill="#147d6f" >where it should point</text>
<line x1="150.0" y1="204.0" x2="198.9" y2="145.8" stroke="#c2630b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ao)"/>
<text x="208.0" y="144.0" font-size="10" font-weight="700" text-anchor="start" fill="#c2630b" >where it points</text>
<path d="M150.0,164.0 A40,40 0 0 1 175.7,173.4" fill="none" stroke="#52606d" stroke-width="1.4"/>
<text x="224.0" y="190.0" font-size="9.5" font-weight="400" text-anchor="start" fill="#52606d" >40 deg off</text>
<text x="203.0" y="258.0" font-size="10" font-weight="700" text-anchor="middle" fill="#d64545" >full speed now would push the robot sideways</text>
<rect x="388.0" y="84.0" width="338.0" height="186.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<line x1="402.0" y1="250.0" x2="712.0" y2="250.0" stroke="#cbd2d9" stroke-width="1.2" stroke-linecap="round"/>
<line x1="402.0" y1="110.0" x2="402.0" y2="250.0" stroke="#cbd2d9" stroke-width="1.2" stroke-linecap="round"/>
<text x="400.0" y="101.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >drive speed sent</text>
<text x="714.0" y="263.0" font-size="10" font-weight="400" text-anchor="end" fill="#52606d" >angle error, 0 to 90 deg</text>
