<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">From a command to the motor</title>
<desc id="d">A flow diagram. A command such as arm.run or arm.runTo gives a setpoint to the mechanism, which gives it to the SmartMotorController. The controller runs the profile, PID, feedforward and limits and sends volts to the motor, and reads back the encoder position and velocity. updateTelemetry is called every loop to publish values and draw the mechanism. simIterate is called every loop in simulation to step the physics.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="340" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="308.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >From a command to the motor</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >What happens between asking a mechanism to move and it moving.</text>
<rect x="34.0" y="104.0" width="132.0" height="76.0" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6" />
<text x="100.0" y="132.2" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >A command</text>
<text x="100.0" y="147.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" font-family="Consolas, Menlo, monospace">arm.run(...)</text>
<text x="100.0" y="162.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" font-family="Consolas, Menlo, monospace">arm.runTo(...)</text>
<rect x="204.0" y="104.0" width="132.0" height="76.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<text x="270.0" y="132.2" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >The mechanism</text>
<text x="270.0" y="147.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >Arm, Elevator,</text>
<text x="270.0" y="162.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >Pivot, FlyWheel</text>
<rect x="374.0" y="104.0" width="160.0" height="76.0" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<text x="454.0" y="132.2" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >SmartMotorController</text>
<text x="454.0" y="147.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >profile, PID,</text>
<text x="454.0" y="162.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >feedforward, limits</text>
<rect x="572.0" y="104.0" width="154.0" height="76.0" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="649.0" y="132.2" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >The motor</text>
<text x="649.0" y="147.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >and the real</text>
<text x="649.0" y="162.2" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >mechanism</text>
<line x1="170.0" y1="142.0" x2="200.0" y2="142.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<line x1="340.0" y1="142.0" x2="370.0" y2="142.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<line x1="538.0" y1="142.0" x2="568.0" y2="142.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="185.0" y="132.0" font-size="8.6" font-weight="400" text-anchor="middle" fill="#52606d" >setpoint</text>
<text x="355.0" y="132.0" font-size="8.6" font-weight="400" text-anchor="middle" fill="#52606d" >setpoint</text>
<text x="553.0" y="132.0" font-size="8.6" font-weight="400" text-anchor="middle" fill="#52606d" >volts</text>
<path d="M649.0,184.0 L649.0,212.0 L454.0,212.0 L454.0,186.0" fill="none" stroke="#52606d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="454.0" y1="194.0" x2="454.0" y2="184.0" stroke="#52606d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="551.0" y="228.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >encoder position and velocity</text>
<rect x="34.0" y="246.0" width="338.0" height="44.0" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.2" />
<text x="48.0" y="264.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">updateTelemetry()</text>
<text x="48.0" y="281.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >every loop: publishes values and draws the mechanism</text>
<rect x="388.0" y="246.0" width="338.0" height="44.0" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.2" />
<text x="402.0" y="264.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">simIterate()</text>
<text x="402.0" y="281.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >every loop in simulation: steps the physics</text>
<text x="34.0" y="316.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >A command only chooses the setpoint. The motor controller does the work of getting there and staying there.</text>
</svg>
