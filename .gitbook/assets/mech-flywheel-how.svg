<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How a flywheel works</title>
<desc id="d">A graph of flywheel speed against time. It spins up to the speed you asked for, sits inside a tolerance band where it is ready to shoot, drops when a game piece goes through, and recovers back into the band.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="314" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="282.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >How a flywheel works</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >It spins up to a speed, holds it, and recovers when something slows it down.</text>
<rect x="34.0" y="84.0" width="692.0" height="180.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<line x1="48.0" y1="244.0" x2="712.0" y2="244.0" stroke="#cbd2d9" stroke-width="1.2" stroke-linecap="round"/>
<line x1="48.0" y1="110.0" x2="48.0" y2="244.0" stroke="#cbd2d9" stroke-width="1.2" stroke-linecap="round"/>
<text x="46.0" y="101.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >speed</text>
<text x="714.0" y="257.0" font-size="10" font-weight="400" text-anchor="end" fill="#52606d" >time</text>
<line x1="48.0" y1="136.8" x2="712.0" y2="136.8" stroke="#3e6da8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="708.0" y="130.8" font-size="10" font-weight="700" text-anchor="end" fill="#3e6da8" >the speed you asked for</text>
<rect x="48.0" y="130.1" width="664.0" height="13.4" rx="0" fill="#d5f0ea" stroke="none" stroke-width="0" opacity="0.7"/>
