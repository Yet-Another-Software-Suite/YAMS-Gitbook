<text x="94.5" y="195.8" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" >1. spins up</text>
<text x="260.5" y="160.9" font-size="10.5" font-weight="700" text-anchor="start" fill="#147d6f" >2. inside the tolerance:</text>
<text x="260.5" y="174.9" font-size="10.5" font-weight="700" text-anchor="start" fill="#147d6f" >    ready to shoot</text>
<line x1="380.0" y1="112.0" x2="380.0" y2="244.0" stroke="#52606d" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="386.6" y="195.8" font-size="10.5" font-weight="700" text-anchor="start" fill="#d64545" >3. a game piece goes through:</text>
<text x="386.6" y="209.8" font-size="10.5" font-weight="700" text-anchor="start" fill="#d64545" >    it slows, then recovers</text>
<text x="34.0" y="290.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >A flywheel holds a speed, not a position. kV gets it to the speed, and kP brings it back after each shot.</text>
</svg>
