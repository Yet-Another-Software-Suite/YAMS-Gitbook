<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withVoltageCompensation</title>
<desc id="d">Two panels comparing a 50 percent output at a 12.6 volt and a 10.5 volt battery. Without voltage compensation the motor gets 6.3 volts and then 5.25 volts, so the mechanism slows as the battery drains. With compensation to 12 volts it gets 6 volts both times.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="302" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="270.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withVoltageCompensation</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Makes a duty cycle mean the same voltage whatever the battery is doing.</text>
<rect x="34.0" y="84.0" width="338.0" height="168.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#52606d" >Without voltage compensation</text>
<text x="48.0" y="130.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >battery 12.6 V</text>
<text x="48.0" y="146.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">50% output</text>
<rect x="152.0" y="118.0" width="150.0" height="20.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<rect x="152.0" y="118.0" width="135.0" height="20.0" rx="4" fill="#fde3c8" stroke="#c2630b" stroke-width="1.4" />
<text x="310.0" y="132.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" >6.30 V</text>
<text x="48.0" y="188.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >battery 10.5 V</text>
<text x="48.0" y="204.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">50% output</text>
<rect x="152.0" y="176.0" width="150.0" height="20.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<rect x="152.0" y="176.0" width="112.5" height="20.0" rx="4" fill="#fde3c8" stroke="#c2630b" stroke-width="1.4" />
<text x="310.0" y="190.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" >5.25 V</text>
<text x="203.0" y="240.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c2630b" >the mechanism slows as the battery drains</text>
<rect x="388.0" y="84.0" width="338.0" height="168.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="400.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >withVoltageCompensation(Volts.of(12))</text>
<text x="402.0" y="130.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >battery 12.6 V</text>
<text x="402.0" y="146.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">50% output</text>
<rect x="506.0" y="118.0" width="150.0" height="20.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<rect x="506.0" y="118.0" width="128.6" height="20.0" rx="4" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.4" />
<text x="664.0" y="132.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#147d6f" >6.00 V</text>
<text x="402.0" y="188.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2933" >battery 10.5 V</text>
<text x="402.0" y="204.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">50% output</text>
<rect x="506.0" y="176.0" width="150.0" height="20.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<rect x="506.0" y="176.0" width="128.6" height="20.0" rx="4" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.4" />
<text x="664.0" y="190.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#147d6f" >6.00 V</text>
<text x="557.0" y="240.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#147d6f" >the same command gives the same volts</text>
<text x="34.0" y="278.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Useful for duty cycle control. Closed loop control in YAMS already works in volts.</text>
</svg>
