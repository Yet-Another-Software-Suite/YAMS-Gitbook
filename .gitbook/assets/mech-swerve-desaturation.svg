<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withMaximumModuleSpeed and withMaximumChassisSpeed</title>
<desc id="d">Two bar charts of four wheel speeds. As asked for, two wheels are above the 4.5 meters per second maximum. With withMaximumModuleSpeed all four are slowed by the same factor so the fastest is at the maximum, which keeps the direction of travel.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="324" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="292.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withMaximumModuleSpeed and withMaximumChassisSpeed</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >What happens when a move needs a wheel to go faster than it can.</text>
<rect x="34.0" y="84.0" width="338.0" height="190.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#52606d" >Asked for</text>
<rect x="388.0" y="84.0" width="338.0" height="190.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="400.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >withMaximumModuleSpeed: 4.5 m/s</text>
<line x1="64.0" y1="157.0" x2="334.0" y2="157.0" stroke="#d64545" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="338.0" y="161.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#d64545" >4.5</text>
<rect x="86.0" y="128.4" width="36.0" height="127.6" rx="3" fill="#fde2e2" stroke="#d64545" stroke-width="1.6" />
<text x="104.0" y="123.4" font-size="10" font-weight="700" text-anchor="middle" fill="#d64545" >5.8</text>
<text x="104.0" y="268.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >FL</text>
<rect x="148.0" y="148.2" width="36.0" height="107.8" rx="3" fill="#fde2e2" stroke="#d64545" stroke-width="1.6" />
<text x="166.0" y="143.2" font-size="10" font-weight="700" text-anchor="middle" fill="#d64545" >4.9</text>
<text x="166.0" y="268.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >FR</text>
<rect x="210.0" y="176.8" width="36.0" height="79.2" rx="3" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="228.0" y="171.8" font-size="10" font-weight="700" text-anchor="middle" fill="#147d6f" >3.6</text>
<text x="228.0" y="268.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >BL</text>
<rect x="272.0" y="192.2" width="36.0" height="63.8" rx="3" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="290.0" y="187.2" font-size="10" font-weight="700" text-anchor="middle" fill="#147d6f" >2.9</text>
<text x="290.0" y="268.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >BR</text>
<line x1="418.0" y1="157.0" x2="688.0" y2="157.0" stroke="#d64545" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="692.0" y="161.0" font-size="9.5" font-weight="700" text-anchor="start" fill="#d64545" >4.5</text>
<rect x="440.0" y="157.0" width="36.0" height="99.0" rx="3" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="458.0" y="152.0" font-size="10" font-weight="700" text-anchor="middle" fill="#147d6f" >4.5</text>
<text x="458.0" y="268.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >FL</text>
<rect x="502.0" y="172.4" width="36.0" height="83.6" rx="3" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="520.0" y="167.4" font-size="10" font-weight="700" text-anchor="middle" fill="#147d6f" >3.8</text>
<text x="520.0" y="268.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >FR</text>
<rect x="564.0" y="194.6" width="36.0" height="61.4" rx="3" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="582.0" y="189.6" font-size="10" font-weight="700" text-anchor="middle" fill="#147d6f" >2.8</text>
<text x="582.0" y="268.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >BL</text>
<rect x="626.0" y="206.5" width="36.0" height="49.5" rx="3" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="644.0" y="201.5" font-size="10" font-weight="700" text-anchor="middle" fill="#147d6f" >2.2</text>
<text x="644.0" y="268.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >BR</text>
<text x="290.0" y="124.0" font-size="10" font-weight="700" text-anchor="middle" fill="#d64545" >two wheels cannot</text>
<text x="290.0" y="138.0" font-size="10" font-weight="700" text-anchor="middle" fill="#d64545" >go this fast</text>
<text x="650.0" y="124.0" font-size="10" font-weight="700" text-anchor="middle" fill="#147d6f" >all four slowed</text>
<text x="650.0" y="138.0" font-size="10" font-weight="700" text-anchor="middle" fill="#147d6f" >by the same factor</text>
<text x="34.0" y="300.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Slowing every wheel together keeps the robot moving in the direction you asked for, only slower.</text>
</svg>
