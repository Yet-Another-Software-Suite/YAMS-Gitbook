<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ElevatorConfig: withAngle and withHorizontalElevator</title>
<desc id="d">Three elevators. A vertical elevator, the default at 90 degrees, has gravity simulated. A slanted elevator set with withAngle at 50 degrees is drawn slanted but still simulated with full gravity. A horizontal slide, set with an angle of 0 and withHorizontalElevator, has no gravity simulated.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="330" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="298.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >ElevatorConfig: withAngle and withHorizontalElevator</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >One sets how the elevator is drawn. The other turns gravity off in simulation.</text>
<rect x="34.0" y="84.0" width="220.0" height="196.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >Vertical (the default)</text>
<line x1="54.0" y1="234.0" x2="234.0" y2="234.0" stroke="#cbd2d9" stroke-width="1.6" stroke-linecap="round"/>
<line x1="96.0" y1="226.0" x2="96.0" y2="130.0" stroke="#52606d" stroke-width="8" stroke-linecap="round"/>
<rect x="83.0" y="157.0" width="26.0" height="26.0" rx="4" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.8" />
<text x="144.0" y="254.0" font-size="8.6" font-weight="400" text-anchor="middle" fill="#52606d" font-family="Consolas, Menlo, monospace">withAngle(Degrees.of(90))</text>
<text x="144.0" y="271.0" font-size="10" font-weight="700" text-anchor="middle" fill="#147d6f" >gravity is simulated</text>
<line x1="122.0" y1="164.0" x2="122.0" y2="200.0" stroke="#d64545" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="270.0" y="84.0" width="220.0" height="196.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="282.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" >Slanted</text>
<line x1="290.0" y1="234.0" x2="470.0" y2="234.0" stroke="#cbd2d9" stroke-width="1.6" stroke-linecap="round"/>
<line x1="332.0" y1="226.0" x2="393.7" y2="152.5" stroke="#52606d" stroke-width="8" stroke-linecap="round"/>
<rect x="355.0" y="170.1" width="26.0" height="26.0" rx="4" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.8" />
<text x="380.0" y="254.0" font-size="8.6" font-weight="400" text-anchor="middle" fill="#52606d" font-family="Consolas, Menlo, monospace">withAngle(Degrees.of(50))</text>
<text x="380.0" y="271.0" font-size="10" font-weight="700" text-anchor="middle" fill="#c2630b" >drawn slanted, full gravity</text>
<line x1="394.0" y1="177.1" x2="394.0" y2="213.1" stroke="#d64545" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="506.0" y="84.0" width="220.0" height="196.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="518.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#3e6da8" >Horizontal slide</text>
<line x1="526.0" y1="234.0" x2="706.0" y2="234.0" stroke="#cbd2d9" stroke-width="1.6" stroke-linecap="round"/>
<line x1="568.0" y1="226.0" x2="664.0" y2="226.0" stroke="#52606d" stroke-width="8" stroke-linecap="round"/>
<rect x="611.0" y="213.0" width="26.0" height="26.0" rx="4" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.8" />
<text x="616.0" y="254.0" font-size="8.6" font-weight="400" text-anchor="middle" fill="#52606d" font-family="Consolas, Menlo, monospace">withAngle(0) + withHorizontalElevator()</text>
<text x="616.0" y="271.0" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6da8" >no gravity simulated</text>
<text x="34.0" y="306.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >withAngle only changes the drawing. Gravity is all or nothing: it is simulated unless you call withHorizontalElevator.</text>
</svg>
