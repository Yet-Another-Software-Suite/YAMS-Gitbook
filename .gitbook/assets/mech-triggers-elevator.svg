<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >Asking where the elevator is</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Triggers that turn the elevator's height into true or false.</text>
<rect x="60.0" y="123.0" width="640.0" height="18.0" rx="9" fill="#eef1f4" stroke="#cbd2d9" stroke-width="1.2" />
