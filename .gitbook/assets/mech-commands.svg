<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The commands every mechanism has</title>
<desc id="d">Three timelines starting when the command is scheduled. run(setpoint), also called setAngle or setHeight, runs until something else takes the mechanism and holds the setpoint the whole time. runTo(setpoint, tolerance) ends when the mechanism is within the tolerance, and then the default command takes over. set(dutycycle) and setVoltage(volts) are open loop with no PID, run until interrupted, and the closed loop controller comes back when they end.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="336" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="304.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >The commands every mechanism has</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Three kinds, which differ in when they end and whether the closed loop runs.</text>
<line x1="250.0" y1="92.0" x2="250.0" y2="286.0" stroke="#cbd2d9" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="250.0" y="86.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#52606d" >scheduled</text>
<text x="34.0" y="118.0" font-size="11" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">run(setpoint)</text>
<text x="34.0" y="134.0" font-size="9.6" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">setAngle, setHeight</text>
<rect x="250.0" y="104.0" width="476.0" height="26.0" rx="5" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<text x="258.0" y="121.0" font-size="10" font-weight="700" text-anchor="start" fill="#1f2933" >runs until something else takes the mechanism</text>
<text x="250.0" y="146.0" font-size="9.6" font-weight="400" text-anchor="start" fill="#52606d" >holds the setpoint the whole time</text>
<text x="34.0" y="182.0" font-size="11" font-weight="700" text-anchor="start" fill="#147d6f" font-family="Consolas, Menlo, monospace">runTo(setpoint, tolerance)</text>
<text x="34.0" y="198.0" font-size="9.6" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace"></text>
<rect x="250.0" y="168.0" width="219.0" height="26.0" rx="5" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6" />
<text x="258.0" y="185.0" font-size="10" font-weight="700" text-anchor="start" fill="#1f2933" >ends once within the tolerance</text>
<text x="250.0" y="210.0" font-size="9.6" font-weight="400" text-anchor="start" fill="#52606d" >then the default command takes over</text>
<line x1="469.0" y1="162.0" x2="469.0" y2="200.0" stroke="#147d6f" stroke-width="1.6" stroke-linecap="round"/>
<text x="475.0" y="185.0" font-size="10" font-weight="700" text-anchor="start" fill="#147d6f" >ends</text>
<text x="34.0" y="246.0" font-size="11" font-weight="700" text-anchor="start" fill="#3e6da8" font-family="Consolas, Menlo, monospace">set(dutycycle)</text>
<text x="34.0" y="262.0" font-size="9.6" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">setVoltage(volts)</text>
<rect x="250.0" y="232.0" width="476.0" height="26.0" rx="5" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<text x="258.0" y="249.0" font-size="10" font-weight="700" text-anchor="start" fill="#1f2933" >open loop: no PID, runs until interrupted</text>
<text x="250.0" y="274.0" font-size="9.6" font-weight="400" text-anchor="start" fill="#52606d" >the closed loop controller comes back when it ends</text>
<text x="34.0" y="312.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >The names are the same in Commands v2 and Commands v3. Only how the commands are built inside differs.</text>
</svg>
