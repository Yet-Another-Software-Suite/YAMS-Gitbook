<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Finding kG and kS on a sprung elevator</title>
<desc id="d">A bar chart of two voltages: plus 1.1 volts just makes the carriage creep up and minus 0.5 volts just makes it creep down. kG is halfway between them, 0.3 volts. kS is half the gap between them, 0.8 volts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
<rect width="760" height="310" fill="#f5f7fa"/>
<rect x="16" y="16" width="728" height="278" rx="10" fill="#ffffff" stroke="#cbd2d9"/>
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >Finding kG and kS on a sprung elevator</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Two small voltages give you both, with no need to know how strong the spring is.</text>
<rect x="60" y="104" width="400" height="150" rx="6" fill="#fafbfc" stroke="#cbd2d9"/>
<line x1="70" y1="193.0" x2="450" y2="193.0" stroke="#52606d" stroke-width="1.3"/>
<text x="74.0" y="207.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >0 V</text>
<rect x="130" y="144.6" width="70" height="48.400000000000006" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6"/>
<text x="165.0" y="136.6" font-size="12" font-weight="700" text-anchor="middle" fill="#3e6da8" >+1.1 V</text>
<text x="165.0" y="209.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >just creeps up</text>
<rect x="300" y="193.0" width="70" height="22.0" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6"/>
<text x="335.0" y="231.0" font-size="12" font-weight="700" text-anchor="middle" fill="#6b46c1" >-0.5 V</text>
<text x="335.0" y="171.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >just creeps down</text>
<line x1="70" y1="179.8" x2="450" y2="179.8" stroke="#c2630b" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="448.0" y="174.8" font-size="10.5" font-weight="700" text-anchor="end" fill="#c2630b" >kG: halfway between</text>
<text x="60.0" y="96.0" font-size="12" font-weight="700" text-anchor="start" fill="#1f2933" >Find the voltage that just moves it each way</text>
<rect x="490" y="104" width="236" height="70" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.5"/>
<text x="504.0" y="126.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kG = (up + down) / 2</text>
<text x="504.0" y="146.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">   = (1.1 + -0.5) / 2</text>
<text x="504.0" y="164.0" font-size="11" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">   = 0.3 V</text>
<rect x="490" y="184" width="236" height="70" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.5"/>
<text x="504.0" y="206.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">kS = (up - down) / 2</text>
<text x="504.0" y="226.0" font-size="11" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">   = (1.1 - -0.5) / 2</text>
<text x="504.0" y="244.0" font-size="11" font-weight="700" text-anchor="start" fill="#147d6f" font-family="Consolas, Menlo, monospace">   = 0.8 V</text>
<text x="34.0" y="284.0" font-size="12" font-weight="700" text-anchor="start" fill="#1f2933" >This works with any spring, because it measures what is left for the motor to do. Example values.</text>
</svg>
