<text x="46.0" y="101.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >closed loop output</text>
<text x="714.0" y="245.0" font-size="10" font-weight="400" text-anchor="end" fill="#52606d" >time</text>
<line x1="48.0" y1="175.7" x2="712.0" y2="175.7" stroke="#d64545" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="708.0" y="170.7" font-size="10" font-weight="700" text-anchor="end" fill="#d64545" >maximum: 6 V</text>
