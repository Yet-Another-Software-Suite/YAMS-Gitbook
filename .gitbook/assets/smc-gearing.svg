<rect width="760" height="306" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="274.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withGearing</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >How many times the motor turns for one turn of the mechanism.</text>
