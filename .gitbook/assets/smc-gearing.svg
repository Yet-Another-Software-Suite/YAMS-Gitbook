<text x="514.0" y="126.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >With a 12:1 reduction</text>
<text x="514.0" y="148.0" font-size="11" font-weight="400" text-anchor="start" fill="#3e6da8" >12 rotor rotations</text>
<text x="514.0" y="166.0" font-size="11" font-weight="400" text-anchor="start" fill="#147d6f" >= 1 mechanism rotation</text>
<text x="514.0" y="192.0" font-size="9.6" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">GearBox.fromReductionStages(3, 4)</text>
<text x="514.0" y="208.0" font-size="9.6" font-weight="400" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">withGearing(12)</text>
<text x="514.0" y="226.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >both mean the same</text>
<text x="34.0" y="282.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Every angle YAMS gives you is the mechanism's. The rotor is only used inside.</text>
