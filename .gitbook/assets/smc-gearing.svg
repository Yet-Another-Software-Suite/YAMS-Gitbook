<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withGearing</title>
<desc id="d">A motor rotor drives a gearbox with 3 to 1 and 4 to 1 stages, 12 to 1 in total, which drives the mechanism's output shaft. Twelve rotor rotations are one mechanism rotation. GearBox.fromReductionStages(3, 4) and withGearing(12) mean the same.</desc>
