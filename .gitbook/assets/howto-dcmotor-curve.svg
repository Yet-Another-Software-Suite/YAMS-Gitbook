<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">A DCMotor is four points from the datasheet</title>
<desc id="d">A graph of torque and current against motor speed for a Minion at 12 volts. Torque falls in a straight line from the stall torque of 3.1 newton meters at zero speed to zero at the free speed of 7200 RPM. Current falls from the stall current of 200.46 amps to the free current of 1.43 amps. Beside it, the DCMotor constructor takes the nominal voltage, stall torque, stall current, free current, free speed and number of motors, in that order.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="372" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="340.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >A DCMotor is four points from the datasheet</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The Minion at 12 V. Simulation draws the motor's torque and current at every speed from these values.</text>
<rect x="34.0" y="78.0" width="420.0" height="262.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<line x1="76.0" y1="294.0" x2="442.0" y2="294.0" stroke="#cbd2d9" stroke-width="1.2" stroke-linecap="round"/>
<line x1="76.0" y1="98.0" x2="76.0" y2="294.0" stroke="#cbd2d9" stroke-width="1.2" stroke-linecap="round"/>
<text x="254.0" y="328.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >motor speed</text>
<text x="76.0" y="310.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >0</text>
<text x="440.0" y="310.0" font-size="11" font-weight="700" text-anchor="end" fill="#147d6f" >free speed 7200 RPM</text>
<path d="M76.0,104.0 L432.0,294.0" fill="none" stroke="#3e6da8" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M76.0,176.2 L432.0,284.6" fill="none" stroke="#c2630b" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<circle cx="76.0" cy="104.0" r="6" fill="#3e6da8" stroke="#ffffff" stroke-width="2" />
<text x="88.0" y="106.0" font-size="11" font-weight="700" text-anchor="start" fill="#3e6da8" >stall torque 3.1 N·m</text>
<line x1="80.0" y1="182.2" x2="98.0" y2="226.2" stroke="#c2630b" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="76.0" cy="176.2" r="6" fill="#c2630b" stroke="#ffffff" stroke-width="2" />
<text x="90.0" y="242.2" font-size="11" font-weight="700" text-anchor="start" fill="#c2630b" >stall current 200.46 A</text>
<circle cx="432.0" cy="294.0" r="6" fill="#147d6f" stroke="#ffffff" stroke-width="2" />
<line x1="432.0" y1="278.6" x2="432.0" y2="231.6" stroke="#6b46c1" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="432.0" cy="284.6" r="6" fill="#6b46c1" stroke="#ffffff" stroke-width="2" />
<text x="440.0" y="225.6" font-size="11" font-weight="700" text-anchor="end" fill="#6b46c1" >free current 1.43 A</text>
<line x1="226.0" y1="108.0" x2="252.0" y2="108.0" stroke="#3e6da8" stroke-width="2.8" stroke-linecap="round"/>
<text x="258.0" y="112.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >torque</text>
<line x1="312.0" y1="108.0" x2="338.0" y2="108.0" stroke="#c2630b" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="344.0" y="112.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >current</text>
<rect x="470.0" y="78.0" width="256.0" height="262.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" />
<text x="486.0" y="102.0" font-size="12" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">new DCMotor(</text>
<circle cx="494.0" cy="126.0" r="5" fill="#52606d" stroke="none" stroke-width="1.6" />
<text x="508.0" y="130.0" font-size="12" font-weight="700" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">12,</text>
<text x="590.0" y="130.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >nominal voltage, volts</text>
<circle cx="494.0" cy="156.0" r="5" fill="#3e6da8" stroke="none" stroke-width="1.6" />
<text x="508.0" y="160.0" font-size="12" font-weight="700" text-anchor="start" fill="#3e6da8" font-family="Consolas, Menlo, monospace">3.1,</text>
<text x="590.0" y="160.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >stall torque, N·m</text>
<circle cx="494.0" cy="186.0" r="5" fill="#c2630b" stroke="none" stroke-width="1.6" />
<text x="508.0" y="190.0" font-size="12" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">200.46,</text>
<text x="590.0" y="190.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >stall current, amps</text>
<circle cx="494.0" cy="216.0" r="5" fill="#6b46c1" stroke="none" stroke-width="1.6" />
<text x="508.0" y="220.0" font-size="12" font-weight="700" text-anchor="start" fill="#6b46c1" font-family="Consolas, Menlo, monospace">1.43,</text>
<text x="590.0" y="220.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >free current, amps</text>
<circle cx="494.0" cy="246.0" r="5" fill="#147d6f" stroke="none" stroke-width="1.6" />
<text x="508.0" y="250.0" font-size="12" font-weight="700" text-anchor="start" fill="#147d6f" font-family="Consolas, Menlo, monospace">7200 RPM,</text>
<text x="590.0" y="250.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >free speed, as rad/s</text>
<circle cx="494.0" cy="276.0" r="5" fill="#52606d" stroke="none" stroke-width="1.6" />
<text x="508.0" y="280.0" font-size="12" font-weight="700" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">1);</text>
<text x="590.0" y="280.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >motors in the gearbox</text>
<text x="486.0" y="314.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >At a stall the motor makes its most torque</text>
<text x="486.0" y="329.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >and draws its most current.</text>
</svg>
