<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">SwerveModuleConfig: the absolute encoder and its offset</title>
<desc id="d">Two panels. Zero must be with the wheel pointing forward and its bevel gear facing the robot's left. To find the offset, point every wheel forward with bevels to the left, read each absolute encoder, and use that reading, here 64 degrees, as that module's offset.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="320" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="288.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >SwerveModuleConfig: the absolute encoder and its offset</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The absolute encoder tells each module which way its wheel points when the robot turns on.</text>
<rect x="34.0" y="84.0" width="338.0" height="186.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >Where zero must be</text>
<rect x="388.0" y="84.0" width="338.0" height="186.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="400.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#6b46c1" >withAbsoluteEncoderOffset</text>
<g transform="translate(120.0,186.0) rotate(0.0)"><rect x="-13.0" y="-35.0" width="26.0" height="70.0" rx="4" fill="#1f2933" stroke="#1f2933" stroke-width="0" /><path d="M-4,-27.0 L0,-33.0 L4,-27.0 Z" fill="#ffffff"/></g>
<rect x="133.0" y="166.0" width="10.0" height="40.0" rx="2" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<line x1="120.0" y1="142.0" x2="120.0" y2="112.0" stroke="#c2630b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ao)"/>
<text x="120.0" y="242.0" font-size="10" font-weight="400" text-anchor="middle" fill="#52606d" >wheel pointing forward</text>
<text x="190.0" y="150.0" font-size="10" font-weight="700" text-anchor="start" fill="#c2630b" >front of the robot</text>
<line x1="184.0" y1="146.0" x2="132.0" y2="124.0" stroke="#52606d" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="190.0" y="190.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >bevel gear facing</text>
<text x="190.0" y="206.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" >the robot's left</text>
<text x="190.0" y="230.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >the absolute encoder</text>
<text x="190.0" y="246.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#147d6f" >must read 0 here</text>
<circle cx="470.0" cy="176.0" r="44" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.6" />
<line x1="470.0" y1="132.0" x2="470.0" y2="142.0" stroke="#52606d" stroke-width="1.6" stroke-linecap="round"/>
<line x1="470.0" y1="176.0" x2="502.4" y2="160.2" stroke="#c2630b" stroke-width="3" stroke-linecap="round"/>
<circle cx="470.0" cy="176.0" r="4" fill="#1f2933" stroke="none" stroke-width="1.6" />
<text x="470.0" y="240.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c2630b" >it reads 64 deg</text>
<text x="540.0" y="138.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >1. Point every wheel forward,</text>
<text x="540.0" y="154.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >    bevels to the left.</text>
<text x="540.0" y="178.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >2. Read each absolute encoder.</text>
<text x="540.0" y="202.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >3. Use that reading as</text>
<text x="540.0" y="218.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >    that module's offset.</text>
<text x="540.0" y="244.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#6b46c1" font-family="Consolas, Menlo, monospace">Degrees.of(64)</text>
<text x="34.0" y="296.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Every module has a different offset. Redo it whenever a module or its encoder is taken apart.</text>
</svg>
