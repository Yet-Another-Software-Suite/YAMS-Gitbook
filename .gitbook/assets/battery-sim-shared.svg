<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" width="760" height="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Every mechanism draws from the same simulated battery</title>
<desc id="d">Five mechanisms, an arm, an elevator, a shooter flywheel, an intake roller and a swerve drive with eight motors, each send their current draw to BatterySim. It adds them to 150 amps and computes a battery voltage of 9.0 volts, which every motor then runs from.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
<rect width="760" height="428" fill="#f5f7fa"/>
<rect x="16" y="16" width="728" height="396" rx="10" fill="#ffffff" stroke="#cbd2d9"/>
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >Every mechanism draws from the same simulated battery</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Example currents. The battery here is the default: 12 V with 20 milliohms of internal resistance.</text>
<rect x="34" y="84" width="214" height="44" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6"/>
<text x="141.0" y="103.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >Arm</text>
<text x="141.0" y="119.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >1 motor, drawing 10 A</text>
<line x1="252" y1="106.0" x2="310" y2="152.0" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="34" y="137" width="214" height="44" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6"/>
<text x="141.0" y="156.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >Elevator</text>
<text x="141.0" y="172.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >2 motors, drawing 30 A</text>
<line x1="252" y1="159.0" x2="310" y2="182.0" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="34" y="190" width="214" height="44" rx="8" fill="#d5f0ea" stroke="#147d6f" stroke-width="1.6"/>
<text x="141.0" y="209.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >Shooter flywheel</text>
<text x="141.0" y="225.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >2 motors, drawing 25 A</text>
<line x1="252" y1="212.0" x2="310" y2="212.0" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="34" y="243" width="214" height="44" rx="8" fill="#eef1f4" stroke="#52606d" stroke-width="1.6"/>
<text x="141.0" y="262.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >Intake roller</text>
<text x="141.0" y="278.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >1 motor, drawing 5 A</text>
<line x1="252" y1="265.0" x2="310" y2="242.0" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="34" y="296" width="214" height="44" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6"/>
<text x="141.0" y="315.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2933" >Swerve drive</text>
<text x="141.0" y="331.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >8 motors, drawing 80 A</text>
<line x1="252" y1="318.0" x2="310" y2="272.0" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="316" y="128" width="168" height="168" rx="8" fill="#fff7d6" stroke="#b7791f" stroke-width="1.6"/>
<text x="400.0" y="193.8" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2933" >BatterySim</text>
<text x="400.0" y="209.8" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >one battery for</text>
<text x="400.0" y="225.8" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d" >the whole robot</text>
<text x="400.0" y="243.2" font-size="12.5" font-weight="400" text-anchor="middle" fill="#52606d" >total draw 150 A</text>
<line x1="488" y1="212.0" x2="524" y2="212.0" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530" y="150" width="196" height="124" rx="8" fill="#fde2e2" stroke="#d64545" stroke-width="1.6"/>
<text x="628.0" y="197.2" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933" >Battery voltage</text>
<text x="628.0" y="212.8" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52606d" >12.0 V - 150 A x 0.020 ohm</text>
<text x="628.0" y="237.8" font-size="20" font-weight="400" text-anchor="middle" fill="#52606d" >= 9.0 V</text>
<path d="M628,278 V371 H141.0 V345" fill="none" stroke="#52606d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="365.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#d64545" >every motor now runs from 9.0 V, so they all get weaker together</text>
<text x="34.0" y="402.0" font-size="12" font-weight="700" text-anchor="start" fill="#1f2933" >Each simulated motor reports its supply current. The sag depends on the total, not on any one mechanism.</text>
</svg>
