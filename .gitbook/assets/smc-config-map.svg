<text x="46.0" y="396.5" font-size="10.2" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">withUseExternalFeedbackEncoder</text>
<rect x="266.0" y="308.0" width="224.0" height="104.0" rx="8" fill="#dbe7f5" stroke="#3e6da8" stroke-width="1.6" />
<text x="278.0" y="330.0" font-size="13" font-weight="700" text-anchor="start" fill="#3e6da8" >Followers</text>
