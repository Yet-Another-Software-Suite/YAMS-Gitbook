<text x="278.0" y="284.5" font-size="10.2" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace"></text>
<rect x="498.0" y="196.0" width="224.0" height="104.0" rx="8" fill="#fde2e2" stroke="#d64545" stroke-width="1.6" />
<text x="510.0" y="218.0" font-size="13" font-weight="700" text-anchor="start" fill="#d64545" >Limits and protection</text>
<text x="510.0" y="238.0" font-size="10.2" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">withSoftLimits</text>
<text x="510.0" y="253.5" font-size="10.2" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">withStatorCurrentLimit</text>
<text x="510.0" y="269.0" font-size="10.2" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">withOpenLoopRampRate</text>
<text x="510.0" y="284.5" font-size="10.2" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">withTemperatureCutoff</text>
<rect x="34.0" y="308.0" width="224.0" height="104.0" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6" />
<text x="46.0" y="330.0" font-size="13" font-weight="700" text-anchor="start" fill="#6b46c1" >Encoders</text>
