<rect x="34.0" y="196.0" width="224.0" height="104.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<text x="46.0" y="218.0" font-size="13" font-weight="700" text-anchor="start" fill="#c2630b" >Feedforward</text>
<text x="46.0" y="238.0" font-size="10.2" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">withFeedforward</text>
<text x="46.0" y="253.5" font-size="10.2" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">SimpleMotorFeedforward</text>
<text x="46.0" y="269.0" font-size="10.2" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">ArmFeedforward</text>
<text x="46.0" y="284.5" font-size="10.2" font-weight="400" text-anchor="start" fill="#52606d" font-family="Consolas, Menlo, monospace">ElevatorFeedforward</text>
<rect x="266.0" y="196.0" width="224.0" height="104.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" />
<text x="278.0" y="218.0" font-size="13" font-weight="700" text-anchor="start" fill="#c2630b" >Motion profiles</text>
