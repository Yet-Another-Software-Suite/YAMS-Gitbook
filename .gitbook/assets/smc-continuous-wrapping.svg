<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withContinuousWrapping</title>
<desc id="d">Two dials going from 170 degrees to minus 170 degrees. Without continuous wrapping the mechanism goes 340 degrees the long way round. With continuous wrapping from minus 180 to 180 degrees it goes 20 degrees across the seam, the short way.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="310" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="278.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withContinuousWrapping</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >Tells the controller that the two ends of the range are the same place.</text>
<rect x="34.0" y="84.0" width="338.0" height="176.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="46.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#52606d" >Without continuous wrapping</text>
<circle cx="144.0" cy="176.0" r="56" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.6" />
<line x1="80.0" y1="176.0" x2="96.0" y2="176.0" stroke="#d64545" stroke-width="2.2" stroke-linecap="round"/>
<text x="62.0" y="180.0" font-size="9.5" font-weight="400" text-anchor="end" fill="#d64545" >180</text>
<circle cx="88.9" cy="166.3" r="6" fill="#3e6da8" stroke="none" stroke-width="1.6" />
<circle cx="88.9" cy="185.7" r="6" fill="#147d6f" stroke="none" stroke-width="1.6" />
<path d="M103.4,165.1 A42,42 0 1 1 103.4,186.9" fill="none" stroke="#c2630b" stroke-width="3" marker-end="url(#ao)"/>
<text x="230.0" y="134.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#3e6da8" >from 170 deg</text>
<text x="230.0" y="152.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#147d6f" >to -170 deg</text>
<text x="230.0" y="182.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c2630b" >340 deg the long way</text>
<text x="230.0" y="200.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >round</text>
<rect x="388.0" y="84.0" width="338.0" height="176.0" rx="8" fill="#fafbfc" stroke="#cbd2d9" stroke-width="1.2" /><text x="400.0" y="104.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >withContinuousWrapping(-180 deg, 180 deg)</text>
<circle cx="498.0" cy="176.0" r="56" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.6" />
<line x1="434.0" y1="176.0" x2="450.0" y2="176.0" stroke="#d64545" stroke-width="2.2" stroke-linecap="round"/>
<text x="416.0" y="180.0" font-size="9.5" font-weight="400" text-anchor="end" fill="#d64545" >180</text>
<circle cx="442.9" cy="166.3" r="6" fill="#3e6da8" stroke="none" stroke-width="1.6" />
<circle cx="442.9" cy="185.7" r="6" fill="#147d6f" stroke="none" stroke-width="1.6" />
<path d="M427.6,161.0 A72,72 0 0 0 427.6,191.0" fill="none" stroke="#147d6f" stroke-width="3" marker-end="url(#ag)"/>
<text x="584.0" y="134.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#3e6da8" >from 170 deg</text>
<text x="584.0" y="152.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#147d6f" >to -170 deg</text>
<text x="584.0" y="182.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#147d6f" >20 deg across the seam</text>
<text x="584.0" y="200.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >the short way</text>
<text x="34.0" y="286.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >For turrets and swerve azimuths that can spin all the way round. Not for anything with a hard stop or wires.</text>
</svg>
