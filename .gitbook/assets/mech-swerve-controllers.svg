<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">withTranslationController and withRotationController</title>
<desc id="d">A field with a robot and a target pose, marking the distance left and the angle left. withTranslationController takes meters from the target and outputs how fast to drive there. withRotationController takes radians from the target heading and outputs how fast to turn, and wraps at 180 degrees for you.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2630b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b46c1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#147d6f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3e6da8"/></marker></defs>
<rect width="760" height="320" fill="#f5f7fa"/>
<rect x="16.0" y="16.0" width="728.0" height="288.0" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" />
<text x="34.0" y="46.0" font-size="15" font-weight="700" text-anchor="start" fill="#1f2933" >withTranslationController and withRotationController</text>
<text x="34.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The two PID controllers that drive the robot to a pose or a heading.</text>
<rect x="34.0" y="90.0" width="400.0" height="180.0" rx="6" fill="#f3f8f3" stroke="#cbd2d9" stroke-width="1.2" />
<g transform="translate(120.0,220.0) rotate(-10.0)">
<rect x="-20.0" y="-20.0" width="40.0" height="40.0" rx="6" fill="#dbe7f5" stroke="#3e6da8" stroke-width="2" />
<path d="M-8,-8.0 L0,-17.0 L8,-8.0 Z" fill="#3e6da8"/>
<rect x="-15.0" y="-17.0" width="8.0" height="16.0" rx="2" fill="#1f2933" stroke="#1f2933" stroke-width="0" />
<rect x="-15.0" y="1.0" width="8.0" height="16.0" rx="2" fill="#1f2933" stroke="#1f2933" stroke-width="0" />
<rect x="7.0" y="-17.0" width="8.0" height="16.0" rx="2" fill="#1f2933" stroke="#1f2933" stroke-width="0" />
<rect x="7.0" y="1.0" width="8.0" height="16.0" rx="2" fill="#1f2933" stroke="#1f2933" stroke-width="0" />
</g>
<g transform="translate(350.0,136.0) rotate(-90.0)">
<rect x="-20.0" y="-20.0" width="40.0" height="40.0" rx="6" fill="#d5f0ea" stroke="#147d6f" stroke-width="2" />
<path d="M-8,-8.0 L0,-17.0 L8,-8.0 Z" fill="#147d6f"/>
<rect x="-15.0" y="-17.0" width="8.0" height="16.0" rx="2" fill="#1f2933" stroke="#1f2933" stroke-width="0" />
<rect x="-15.0" y="1.0" width="8.0" height="16.0" rx="2" fill="#1f2933" stroke="#1f2933" stroke-width="0" />
<rect x="7.0" y="-17.0" width="8.0" height="16.0" rx="2" fill="#1f2933" stroke="#1f2933" stroke-width="0" />
<rect x="7.0" y="1.0" width="8.0" height="16.0" rx="2" fill="#1f2933" stroke="#1f2933" stroke-width="0" />
</g>
<line x1="142.0" y1="206.0" x2="322.0" y2="148.0" stroke="#c2630b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ao)"/>
<text x="214.0" y="196.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" >distance left</text>
<text x="350.0" y="178.0" font-size="10" font-weight="700" text-anchor="middle" fill="#147d6f" >target pose</text>
<path d="M112.0,174.7 A46,46 0 0 0 80.2,197.0" fill="none" stroke="#6b46c1" stroke-width="2.2" marker-end="url(#ap)"/>
<text x="84.0" y="160.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#6b46c1" >angle left</text>
<rect x="450.0" y="90.0" width="276.0" height="86.0" rx="8" fill="#fde3c8" stroke="#c2630b" stroke-width="1.4" />
<text x="462.0" y="112.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#c2630b" font-family="Consolas, Menlo, monospace">withTranslationController</text>
<text x="462.0" y="132.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >input: meters from the target</text>
<text x="462.0" y="149.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >output: how fast to drive there</text>
<text x="462.0" y="166.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >kP 4 means 4 m/s per meter away</text>
<rect x="450.0" y="184.0" width="276.0" height="86.0" rx="8" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.4" />
<text x="462.0" y="206.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#6b46c1" font-family="Consolas, Menlo, monospace">withRotationController</text>
<text x="462.0" y="226.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >input: radians from the target heading</text>
<text x="462.0" y="243.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#52606d" >output: how fast to turn</text>
<text x="462.0" y="260.0" font-size="10" font-weight="400" text-anchor="start" fill="#52606d" >wraps at 180 deg for you</text>
<text x="34.0" y="296.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2933" >Auto-align and the SwerveInputStream heading modes use these. Normal stick driving does not.</text>
</svg>
